<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乱码 / Emoji 生成器</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#2a2a2a; --line:#3a3a3a;
    --txt:#e6e6e6; --muted:#9a9a9a; --accent:#4ec9b0;
    --accent2:#569cd6; --danger:#f48771;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,Segoe UI,monospace;
    background:var(--bg); color:var(--txt); padding:24px;
  }
  h1{font-size:20px; margin:0 0 4px; color:var(--accent)}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px}
  .tabs{display:flex; gap:8px; margin-bottom:14px}
  .tab{
    background:#2a2a2a; color:var(--muted); border:1px solid var(--line);
    border-radius:8px 8px 0 0; padding:10px 18px; font-size:14px; cursor:pointer; transition:.15s;
  }
  .tab.active{background:var(--accent2); color:#fff; border-color:var(--accent2)}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:16px; margin-bottom:16px}
  .panel.hidden{display:none}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  label{font-size:13px; color:var(--muted)}
  input[type=number],select{
    background:#1a1a1a; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:8px 10px; font-size:14px;
  }
  input[type=number]{width:110px}
  select{cursor:pointer}
  button{
    background:var(--accent2); color:#fff; border:none; border-radius:6px;
    padding:8px 16px; font-size:14px; cursor:pointer; transition:.15s;
  }
  button:hover{filter:brightness(1.12)}
  button.ghost{background:#3a3a3a}
  .opts{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:12px}
  .opts label{display:flex; gap:6px; align-items:center; cursor:pointer; color:var(--txt)}
  #out{
    width:100%; min-height:200px; background:#161616; border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:14px; font-size:18px; line-height:1.9;
    word-break:break-all; white-space:pre-wrap; resize:vertical; font-family:"Microsoft YaHei",monospace;
  }
  .meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
  .count{color:var(--muted); font-size:13px}
  .count b{color:var(--accent)}
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--accent); color:#1e1e1e; padding:10px 20px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:.25s; font-weight:600;
  }
  .toast.show{opacity:1}
  code{background:#1a1a1a; padding:2px 6px; border-radius:4px; color:var(--accent)}
</style>
</head>
<body>
  <h1>乱码 / Emoji 生成器</h1>
  <div class="sub">乱码：随机取码点 → <code>UTF-8 编码</code> → <code>UTF-8 解码</code>（全UTF 为纯随机，无比例控制）。Emoji：基于 Unicode 16.0 官方全量（4790 个 / 9 大分组）。</div>

  <div class="tabs">
    <button class="tab active" data-sys="garble">乱码生成器</button>
    <button class="tab" data-sys="emoji">Emoji 生成器</button>
  </div>

  <!-- 乱码面板 -->
  <div class="panel" id="panelGarble">
    <div class="row">
      <label>乱码类型</label>
      <select id="type">
        <option value="cn" selected>中文乱码</option>
        <option value="en">英文乱码</option>
        <option value="jp">日文乱码</option>
        <option value="ko">韩文乱码</option>
        <option value="ar">阿拉伯文乱码</option>
        <option value="uk">乌克兰文乱码</option>
        <option value="th">泰文乱码</option>
        <option value="mix">全UTF乱码（纯随机）</option>
      </select>
      <label>字数个数</label>
      <input type="number" id="len" value="200" min="1" max="100000">
      <button id="genGarble">生成乱码</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optNl"> 每 30 字换行</label>
    </div>
  </div>

  <!-- Emoji 面板 -->
  <div class="panel hidden" id="panelEmoji">
    <div class="row">
      <label>Emoji 种类</label>
      <select id="emojiCat">
        <option value="混合" selected>混合（全部 4790）</option>
        <option value="表情与情感">表情与情感</option>
        <option value="人物与身体">人物与身体</option>
        <option value="动物与自然">动物与自然</option>
        <option value="食物与饮品">食物与饮品</option>
        <option value="旅行与地点">旅行与地点</option>
        <option value="活动">活动</option>
        <option value="物品">物品</option>
        <option value="符号">符号</option>
        <option value="旗帜">旗帜</option>
      </select>
      <label>生成数量</label>
      <input type="number" id="emojiLen" value="200" min="1" max="100000">
      <button id="genEmoji">生成 Emoji</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="emojiNl"> 每 30 个换行</label>
      <span class="count" id="emojiPool"></span>
    </div>
  </div>

  <!-- 共享输出 + 操作 -->
  <div class="panel">
    <div class="meta">
      <span class="count">当前字数/个数：<b id="cnum">0</b></span>
      <span class="count" id="mode"></span>
    </div>
    <textarea id="out" readonly placeholder="选择上方系统后点击生成…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="copy">复制</button>
      <button class="ghost" id="export">导出txt</button>
      <button class="ghost" id="share">分享链接</button>
      <button class="ghost" id="clear">清空</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    syncUrl('emoji', {cat:cat, len:n, nl:nl?1:0});
  }

  // ============ 共享操作 ============
  function showToast(msg){
    const t = $('toast'); t.textContent = msg || '已复制到剪贴板';
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1200);
  }
  function copy(){
    const ta = $('out'); if(!ta.value) return;
    navigator.clipboard.writeText(ta.value).then(()=>showToast()).catch(()=>{ ta.select(); document.execCommand('copy'); showToast(); });
  }
  function exportTxt(){
    const ta = $('out'); if(!ta.value){ showToast('请先生成'); return; }
    const prefix = currentSys==='emoji' ? ('emoji_'+$('emojiCat').value) : ('garble_'+$('type').value);
    const blob = new Blob([ta.value], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = prefix + '_' + ta.value.length + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    showToast('已导出 .txt');
  }
  function syncUrl(sys, p){
    const q = new URLSearchParams();
    q.set('sys', sys);
    for(const k in p) q.set(k, p[k]);
    history.replaceState(null, '', location.pathname + '?' + q.toString());
  }
  function share(){
    const q = new URLSearchParams();
    q.set('sys', currentSys);
    if(currentSys==='emoji'){
      q.set('cat', $('emojiCat').value); q.set('len', $('emojiLen').value);
      if($('emojiNl').checked) q.set('nl','1');
    } else {
      q.set('type', $('type').value); q.set('len', $('len').value);
      if($('optNl').checked) q.set('nl','1');
    }
    const url = location.origin + location.pathname + '?' + q.toString();
    navigator.clipboard.writeText(url).then(()=>showToast('分享链接已复制')).catch(()=>prompt('复制此链接：', url));
  }

  function initFromUrl(){
    const p = new URLSearchParams(location.search);
    const sys = p.get('sys');
    if(sys==='emoji' || sys==='garble') switchSys(sys, true);
    if(sys==='emoji'){
      const cats = ['混合','表情与情感','人物与身体','动物与自然','食物与饮品','旅行与地点','活动','物品','符号','旗帜'];
      const c = p.get('cat'); if(c && cats.includes(c)) $('emojiCat').value = c;
      const l = parseInt(p.get('len'),10); if(l>0) $('emojiLen').value = Math.min(100000,l);
      if(p.get('nl')==='1') $('emojiNl').checked = true;
    } else {
      const types = ['cn','en','jp','ko','ar','uk','th','mix'];
      const t = p.get('type'); if(t && types.includes(t)) $('type').value = t;
      const l = parseInt(p.get('len'),10); if(l>0) $('len').value = Math.min(100000,l);
      if(p.get('nl')==='1') $('optNl').checked = true;
    }
  }

  function switchSys(sys, silent){
    currentSys = sys;
    document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.sys===sys));
    $('panelGarble').classList.toggle('hidden', sys!=='garble');
    $('panelEmoji').classList.toggle('hidden', sys!=='emoji');
    if(sys==='emoji'){
      const pool = EMOJI_DB[$('emojiCat').value] || EMOJI_DB['混合'];
      $('emojiPool').textContent = '当前池：' + pool.length + ' 个';
    }
    if(!silent) (sys==='emoji' ? runEmoji() : runGarble());
  }

  // 事件
  document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> switchSys(b.dataset.sys)));
  $('genGarble').addEventListener('click', runGarble);
  $('genEmoji').addEventListener('click', runEmoji);
  $('emojiCat').addEventListener('change', ()=>{
    const pool = EMOJI_DB[$('emojiCat').value] || EMOJI_DB['混合'];
    $('emojiPool').textContent = '当前池：' + pool.length + ' 个';
  });
  $('copy').addEventListener('click', copy);
  $('export').addEventListener('click', exportTxt);
  $('share').addEventListener('click', share);
  $('clear').addEventListener('click', ()=>{ $('out').value=''; $('cnum').textContent='0'; });

  // 启动
  initFromUrl();
  (currentSys==='emoji' ? runEmoji() : runGarble());
})();
</script>
</body>
</html>
