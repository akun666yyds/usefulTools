/* ============================================================
   测试工坊实现（配置见 wsScaleEnemyDmg / wsPlayerAtk 等数值注入点）
   ============================================================ */
function applyWsToEnemy(){
  if (!wsEnemy) return;
  wsEnemy.atkMul = wsCfg.enemyAtk;
  const wk = [], wkS = {}, rs = [], rsS = {};
  ATTRS.forEach(function(a){
    if (wsCfg.weakOn[a.id]){ wk.push(a.id); wkS[a.id] = wsCfg.weakStr[a.id] != null ? wsCfg.weakStr[a.id] : WEAK_MUL; }
    if (wsCfg.resistOn[a.id]){ rs.push(a.id); rsS[a.id] = wsCfg.resistStr[a.id] != null ? wsCfg.resistStr[a.id] : RESIST_MUL; }
  });
  wsEnemy.weak = wk; wsEnemy.weakStr = wkS;
  wsEnemy.resist = rs; wsEnemy.resistStr = rsS;
}
function seedWsDefaults(){
  wsCfg.weakOn = {}; wsCfg.weakStr = {}; wsCfg.resistOn = {}; wsCfg.resistStr = {};
  ['physical','fusion','glacio'].forEach(function(id){ wsCfg.weakOn[id] = true; wsCfg.weakStr[id] = WEAK_MUL; });
  ['sky','blood'].forEach(function(id){ wsCfg.resistOn[id] = true; wsCfg.resistStr[id] = RESIST_MUL; });
}
function buildWorkshopScene(){
  grid = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++) row.push((x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) ? 2 : 0);
    grid.push(row);
  }
  const cx = (MAP_W / 2) | 0, cy = (MAP_H / 2) | 0;
  // 四角钢制掩体
  [[5,5],[MAP_W-6,5],[5,MAP_H-6],[MAP_W-6,MAP_H-6]].forEach(function(p){
    for (let yy = p[1]; yy < p[1] + 3; yy++)
      for (let xx = p[0]; xx < p[0] + 3; xx++)
        if (xx > 0 && yy > 0 && xx < MAP_W - 1 && yy < MAP_H - 1) grid[yy][xx] = 2;
  });
  // 中央两道短墙，提供掩体但不挡视线
  for (let i = -2; i <= 2; i++){
    grid[cy + i][cx - 8] = 2;
    grid[cy + i][cx + 8] = 2;
  }
  resyncWalls();
}
function resyncWalls(){
  walls.length = 0;
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++){
      const t = grid[y][x];
      if (t === 0) continue;
      walls.push({ tx: x, ty: y, type: t, hp: t === 1 ? 3 : Infinity, hitFlash: 0, seed: Math.random() });
    }
}
function paintWallAt(wx, wy, type){
  const tx = (wx / TILE) | 0, ty = (wy / TILE) | 0;
  if (tx <= 0 || ty <= 0 || tx >= MAP_W - 1 || ty >= MAP_H - 1) return;
  grid[ty][tx] = type;
  resyncWalls();
}
function startWorkshop(){
  SFX.init(); SFX.resume();
  state.workshop = true;
  state.wsEdit = false;
  state.mode = 'play';
  // 复用 resetWorld 的清理，但不随机生成地图 / 不刷波
  enemies.length = 0; bullets.length = 0; ebullets.length = 0;
  particles.length = 0; texts.length = 0; beams.length = 0;
  zones.length = 0; arcs.length = 0; rings.length = 0; pickups.length = 0; boss = null; uid = 1;
  state.score = 0; state.time = 0; state.shake = 0; state.waveActive = false; state.plan = [];
  buildWorkshopScene();
  player = makePlayer();
  player.maxHp = 1e9; player.hp = 1e9;            // 无限血量
  wsCfg = JSON.parse(JSON.stringify(WS_DEFAULT));
  seedWsDefaults();
  const e = makeEnemy('grunt', 1);
  e.fixed = true;                                 // 固定敌人：不自行移动
  e.spawnAnim = 0;
  e.x = clamp(player.x + 380, TILE * 2, WORLD_W - TILE * 2);
  e.y = player.y;
  e.stuckX = e.x; e.stuckY = e.y;
  e.maxHp = 1e9; e.hp = 1e9;
  enemies.push(e);
  wsEnemy = e;
  applyWsToEnemy();                               // 元素特效仍按现有逻辑对 e 生效
  el.overlay.classList.add('hide');
  el.ovbox.style.maxWidth = '';
  el.overlay.style.overflow = '';
  updateCam(); updateHUD(); syncHUD();
  waveMsg('测试工坊 · 按 ESC 配置', 2.4);
}
function resetWorkshop(){
  state.wsEdit = false; wsDrag = false;
  wsCfg = JSON.parse(JSON.stringify(WS_DEFAULT));
  seedWsDefaults();
  buildWorkshopScene();
  player.x = WORLD_W / 2; player.y = WORLD_H / 2; player.vx = 0; player.vy = 0;
  player.maxHp = 1e9; player.hp = 1e9;
  if (wsEnemy){
    wsEnemy.x = clamp(player.x + 380, TILE * 2, WORLD_W - TILE * 2);
    wsEnemy.y = player.y; wsEnemy.stuckX = wsEnemy.x; wsEnemy.stuckY = wsEnemy.y;
    wsEnemy.maxHp = 1e9; wsEnemy.hp = 1e9; wsEnemy.fixed = true; wsEnemy.spawnAnim = 0;
    applyWsToEnemy();
  }
  state.mode = 'play';
  el.overlay.classList.add('hide');
  el.ovbox.style.maxWidth = '';
  el.overlay.style.overflow = '';

}

function wsPanelInput(ev){
  const t = ev.target;
  const f = t.dataset.ws;
  if (!f || !wsCfg) return;
  const val = (t.type === 'checkbox') ? t.checked : parseFloat(t.value);
  if (f === 'enemyAtk' || f === 'enemyDef' || f === 'playerAtk' || f === 'playerDef' ||
      f === 'playerSpeed' || f === 'playerAspd'){
    wsCfg[f] = val;
  } else if (f === 'weakOn' || f === 'resistOn' || f === 'weakStr' || f === 'resistStr'){
    wsCfg[f][t.dataset.id] = val;
    applyWsToEnemy();
  }
  if (t.dataset.label){
    const lab = document.getElementById(t.dataset.label);
    if (lab) lab.textContent = (t.type === 'range') ? val.toFixed(2) : val;
  }
}

/**
 * 将当前结算详情渲染为一张 PNG 战绩卡片并触发下载（无外部依赖）。
 * 卡片内容：大分数 + 多维统计（波次/击杀/等级/最大生命/伤害倍率/存活/最佳）+ 元素击杀分布 + 日期。
 */
function exportScoreImage(){
  const W = 640;
  const sk = state.killsByAttr || {};
  const top = ATTRS
    .map(function(a){ return { a: a, n: sk[a.id] || 0 }; })
    .filter(function(o){ return o.n > 0; })
    .sort(function(x, y){ return y.n - x.n; });
  const tUsed = Math.max(0, Math.floor(state.time));
  const mm = Math.floor(tUsed / 60), ss = tUsed % 60;
  const tStr = mm + ':' + (ss < 10 ? '0' : '') + ss;
  const lv = player ? player.level : 1;
  const lvMul = player ? lvlDmgMul().toFixed(2) : '1.00';
  const kills = player ? player.kills : 0;
  const maxHp = player ? Math.round(player.maxHp) : 100;
  const dt = new Date();
  const p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  const dateStr = dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate()) +
    ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());

  const pad = 40, cols = 3, colW = (W - pad * 2) / cols;
  const stats = [
    ['坚持波次', String(state.wave)],
    ['击杀', String(kills)],
    ['等级', String(lv)],
    ['最大生命', String(maxHp)],
    ['伤害倍率', '×' + lvMul],
    ['存活时间', tStr],
    ['历史最佳', fmt(state.best)]
  ];
  const statsRows = Math.ceil(stats.length / cols);
  const headH = 200;
  const statsH = statsRows * 50;
  const elHeaderH = 36;
  const elRowsH = top.length ? top.length * 34 + 8 : 26;
  const footH = 50;
  const H = headH + statsH + 18 + elHeaderH + elRowsH + footH;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  // 背景
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#10131c');
  bg.addColorStop(1, '#1b1430');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // 顶部彩条
  const bar = g.createLinearGradient(0, 0, W, 0);
  bar.addColorStop(0, '#ffd166'); bar.addColorStop(0.5, '#7a5cff'); bar.addColorStop(1, '#3ad6ff');
  g.fillStyle = bar; g.fillRect(0, 0, W, 6);

  g.textAlign = 'center';
  g.fillStyle = '#ffffff'; g.font = '800 30px sans-serif';
  g.fillText('共鸣爆破 · 战绩分享', W / 2, 54);
  g.fillStyle = '#8a93a8'; g.font = '12px sans-serif';
  g.fillText('R E S O N A N C E   B L I T Z', W / 2, 78);

  // 大分数
  g.fillStyle = '#ffd166'; g.font = '800 60px sans-serif';
  g.fillText(fmt(state.score), W / 2, 148);
  g.fillStyle = '#8a93a8'; g.font = '13px sans-serif';
  g.fillText('最终得分', W / 2, 172);

  // 统计网格
  let sy = headH;
  for (let i = 0; i < stats.length; i++){
    const cx = pad + colW * (i % cols) + colW / 2;
    const ry = sy + Math.floor(i / cols) * 50;
    g.fillStyle = '#cdd4e2'; g.font = '800 22px sans-serif';
    g.fillText(stats[i][1], cx, ry);
    g.fillStyle = '#7c8499'; g.font = '12px sans-serif';
    g.fillText(stats[i][0], cx, ry + 20);
  }
  sy += statsH + 18;

  // 元素击杀分布
  g.textAlign = 'left';
  g.fillStyle = '#8a93a8'; g.font = '800 14px sans-serif';
  g.fillText('元素击杀分布', pad, sy);
  sy += elHeaderH;
  if (top.length){
    for (let i = 0; i < top.length; i++){
      const o = top[i];
      const ry = sy + i * 34;
      g.fillStyle = o.a.color;
      g.beginPath(); g.arc(pad + 8, ry - 7, 7, 0, TAU); g.fill();
      g.fillStyle = '#e7ebf3'; g.font = '18px serif';
      g.fillText((o.a.ico ? o.a.ico + ' ' : '') + o.a.name, pad + 26, ry);
      g.textAlign = 'right';
      g.fillStyle = '#ffd166'; g.font = '800 18px sans-serif';
      g.fillText(o.n + ' 杀', W - pad, ry);
      g.textAlign = 'left';
    }
    sy += top.length * 34;
  } else {
    g.fillStyle = '#5c6373'; g.font = '13px sans-serif';
    g.fillText('本局未造成元素击杀', pad, sy);
    sy += 26;
  }

  // 页脚
  g.textAlign = 'center';
  g.fillStyle = '#5c6373'; g.font = '12px sans-serif';
  g.fillText(dateStr + '  ·  长按 / 右键保存分享', W / 2, H - 20);

  // 触发下载
  try {
    const url = c.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = '共鸣爆破_战绩_' + state.score + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (typeof waveMsg === 'function') waveMsg('战绩图片已导出', 1.4);
  } catch (err){
    if (typeof waveMsg === 'function') waveMsg('导出失败：' + (err && err.message ? err.message : err), 2);
  }
}

/* ============================================================
   输入
   ============================================================ */
function bindInput(){
  window.addEventListener('keydown', function(e){
    const k = (e.key || '').toLowerCase();
    keys[k] = true;
    if (k === ' ' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();

    // 测试工坊：ESC/P 配置面板，R 重置（不拦截 Q/E/1-5/滚轮，便于切换弹药与属性测试）
    if (state.workshop){
      if (k === 'escape' || k === 'p') togglePause();
      else if (k === 'r') resetWorkshop();
    }
    if (state.mode === 'menu' || state.mode === 'over'){
      if (k === 'r' || k === 'enter' || k === ' ') startGame();
      return;
    }
    if (k === 'q') switchAmmo(-1);
    if (k === 'e') switchAmmo(1);
    if (!state.workshop && (k === 'p' || k === 'escape')) togglePause();
    if (k === 'r' && !state.workshop) startGame();
    if (k >= '1' && k <= '5'){
      const i = parseInt(k, 10) - 1;
      if (i < AMMO.length && i !== player.ammoIdx){
        player.ammoIdx = i;
        player.cd = Math.max(player.cd, 0.08);
        SFX.sw(); syncHUD();
        waveMsg(curAmmo().name + ' · ' + curAmmo().desc, 1.1);
      }
    }
  });
  window.addEventListener('keyup', function(e){ keys[(e.key || '').toLowerCase()] = false; });
  window.addEventListener('blur', function(){ for (const k in keys) keys[k] = false; mouse.down = false; });

  function updMouse(e){
    const rect = cvs.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    mouse.wx = mouse.x + cam.x;
    mouse.wy = mouse.y + cam.y;
  }
  cvs.addEventListener('mousemove', function(e){
    updMouse(e);
    if (wsDrag && wsEnemy){       // 编辑场景：拖拽敌人
      wsEnemy.x = clamp(mouse.wx, TILE * 0.5, WORLD_W - TILE * 0.5);
      wsEnemy.y = clamp(mouse.wy, TILE * 0.5, WORLD_H - TILE * 0.5);
      collideWalls(wsEnemy);
      wsEnemy.stuckX = wsEnemy.x; wsEnemy.stuckY = wsEnemy.y;
    }
  });
  cvs.addEventListener('mousedown', function(e){
    updMouse(e);
    if (state.wsEdit && e.button === 0){
      if (wsEnemy && Math.hypot(mouse.wx - wsEnemy.x, mouse.wy - wsEnemy.y) < wsEnemy.r + 12){
        wsDrag = true;                                   // 点中敌人 → 拖动
      } else {
        paintWallAt(mouse.wx, mouse.wy, 2);              // 点空地 → 放钢墙
      }
      return;
    }
    if (e.button === 0){ mouse.down = true; SFX.init(); SFX.resume(); }
  });
  window.addEventListener('mouseup', function(e){ if (e.button === 0){ mouse.down = false; wsDrag = false; } });
  cvs.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if (state.wsEdit){ updMouse(e); paintWallAt(mouse.wx, mouse.wy, 0); }   // 右键删墙
  });

  cvs.addEventListener('wheel', function(e){
    e.preventDefault();
    if (state.mode !== 'play') return;
    switchAttr(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  el.overlay.addEventListener('click', function(e){
    if (e.target.closest('.export-btn')){ exportScoreImage(); return; }
    if (e.target.closest('.ws-btn')){ startWorkshop(); return; }
    const act = e.target.closest('[data-wsact]');
    if (act){
      const a = act.dataset.wsact;
      if (a === 'resume'){ togglePause(); }
      else if (a === 'edit'){
        state.wsEdit = true; state.mode = 'play';
        el.overlay.classList.add('hide'); el.ovbox.style.maxWidth = ''; el.overlay.style.overflow = '';
        waveMsg('编辑场景：左键放墙/拖敌人 · 右键删墙 · ESC 退出', 2.6);
      }
      else if (a === 'reset'){ resetWorkshop(); }
      else if (a === 'menu'){
        state.workshop = false; state.wsEdit = false; wsEnemy = null; wsCfg = null;
        state.mode = 'menu';
        el.overlay.classList.add('hide'); el.ovbox.style.maxWidth = ''; el.overlay.style.overflow = '';
        showOverlay('menu');
      }
      return;
    }
    if (state.mode === 'menu' || state.mode === 'over') startGame();
    // 测试工坊配置面板（pause）不响应空白处点击：只能用 ESC / 「继续」/「编辑场景」/「重置」退出，
    // 否则点勾选框/滑块会冒泡到这里触发 togglePause 直接关掉面板
    else if (state.mode === 'pause' && !state.workshop) togglePause();
  });

  // 测试工坊：配置面板输入（数值滑块 / 勾选 / 强度）实时生效
  el.ovbox.addEventListener('input', wsPanelInput);
  el.ovbox.addEventListener('change', wsPanelInput);

  window.addEventListener('resize', resize);
}

/* ============================================================
   主循环
   ============================================================ */
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.06) dt = 0.06;
  if (state.mode === 'play') step(dt);
  render();
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  grabEls();
  resize();
  buildHUD();
  resetWorld();
  bindInput();
  showOverlay('menu');
  requestAnimationFrame(loop);
}

/* 供调试 / 无头测试使用 */
window.GAME = {
  state: state,
  cam: cam,
  ATTRS: ATTRS,
  AMMO: AMMO,
  ENEMY_DEFS: ENEMY_DEFS,
  get player(){ return player; },
  get enemies(){ return enemies; },
  get bullets(){ return bullets; },
  get ebullets(){ return ebullets; },
  get particles(){ return particles; },
  get texts(){ return texts; },
  get zones(){ return zones; },
  get bats(){ return bats; },
  get beams(){ return beams; },
  get shocks(){ return shocks; },
  get grid(){ return grid; },
  step: step,
  render: render,
  start: startGame,
  reset: resetWorld,
  switchAmmo: switchAmmo,
  switchAttr: switchAttr,
  tryFire: tryFire,
  spawnEnemy: spawnEnemy,
  startWave: startWave,
  fireBeam: fireBeam,
  isSolid: isSolid,
  computeDamage: computeDamage,
  applyAttrEffect: applyAttrEffect,
  attrBurst: attrBurst,
  // 平衡测试需要的内部量
  WEAK_SLOTS: WEAK_SLOTS,
  RESIST_SLOTS: RESIST_SLOTS,
  WEAK_MUL: WEAK_MUL,
  RESIST_MUL: RESIST_MUL,
  attrDpsMul: attrDpsMul,
  rollRandMul: rollRandMul,
  rollAttrs: rollAttrs,
  makeEnemy: makeEnemy,
  ANIMALS: ANIMALS,
  splitEnemy: splitEnemy,
  hurtEnemy: hurtEnemy,
  explode: explode,
  keys: keys,
  mouse: mouse,
  setMouse: function(x, y){ mouse.x = x; mouse.y = y; mouse.wx = x + cam.x; mouse.wy = y + cam.y; },
  hurtPlayer: hurtPlayer,
  killEnemy: killEnemy,
  exportScoreImage: exportScoreImage
};

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();
