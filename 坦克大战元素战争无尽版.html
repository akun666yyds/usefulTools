/* ============================================================
   命中伤害
   ============================================================ */
function hurtEnemy(e, dmg, attrId, x, y, crit, tag, quiet){
  if (e.dead) return;
  const attr = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  const isMath = attrId === 'math';
  e.hitFlash = 1;

  let finalD, label, numColor, size, bold, font = null;

  if (tag === 'mathpct'){
    // 数学特殊机制：把目标血量降到命中前的 0.1*a 倍（a = 弹幕常量，已随 dmg 传入）
    const a = dmg;
    const pre = e.hp;
    if (state.workshop) e.hp = e.maxHp;                 // 测试工坊：血量钉满
    else e.hp = 0.1 * a * pre;                          // 正常模式：降到 0.1*a × 命中前血量
    finalD = Math.max(0, pre - e.hp);
    label = '×' + (0.1 * a).toFixed(3);
    numColor = lighten(attr.color, 0.5);                // 数学色更亮
    size = 30; bold = true; font = MATH_FONT;
  } else {
    // 数学固定伤害（非 i）：一切因素不可修改，不叠加玩家攻击/敌方防御缩放
    const fd = (isMath && tag === 'math') ? dmg : wsScaleEnemyDmg(dmg);
    e.hp -= fd;
    if (state.workshop) e.hp = e.maxHp;                 // 测试工坊：敌方无限血量，钉满
    finalD = fd;

    // 伤害飘字：颜色随属性，弱点/抗性带后缀
    label = String(Math.max(1, Math.round(fd)));
    if (tag === '弱点') label += ' 弱点';
    else if (tag === '抗性') label += ' 抗性';
    if (isMath && tag === 'math') label = dmg.toFixed(3);   // 数学固定伤害：保留 3 位小数
    if (crit) label = '✧ ' + label;

    if (isMath){
      // 数学：伤害数字加大加粗、特殊字体、元素色更亮（i 也走此样式，属于数学整体）
      numColor = lighten(attr.color, 0.5);
      size = 30; bold = true; font = MATH_FONT;
    } else {
      // 暴击数字：颜色遵循元素色但更亮（朝白混合），字号更大；普通/弱点沿用元素色
      numColor = tag === '抗性' ? '#8b91a0' : (crit ? lighten(attr.color, 0.5) : attr.color);
      size = crit ? 26 : (tag === '弱点' ? 17 : 15);
      bold = crit || tag === '弱点';
    }
  }

  addText(
    x + rand(-6, 6), y - e.r * 0.5,
    label, numColor,
    { size: size, bold: bold, life: crit ? 1.0 : 0.8, font: font }
  );

  if (!quiet){
    if (attrId !== 'rainbow') attrBurst(x, y, attr, crit ? 1.25 : 1, 'hit');   // 彩虹：命中后无粒子特效
    if (crit) { SFX.crit(); state.shake = Math.max(state.shake, 3); }
    else SFX.hit();
  }

  if (e.hp <= 0) killEnemy(e, attrId);
}

/**
 * 生物分裂：母体消失，原地裂出 2 个幼体。
 * · 幼体 最大生命值 = 分裂前母体 最大生命值 的 30%
 * · 幼体 当前生命值 = 分裂前母体 当前生命值 的 30%
 * · 幼体 攻击力减半（dmgMul = 0.5），且不可再分裂
 * · 母体不计击杀；幼体各计 50% 分数与经验（合计与母体持平）
 */
function splitEnemy(m){
  if (m.dead) return;
  if (enemies.length > 34) return;              // 场面过满时不再分裂，避免失控
  if (m.def.boss || m.canSplit === false) return;

  // 注意：必须先读母体的 maxHp / hp，再取 30%（顺序反了会算错）
  const motherMax = m.maxHp, motherHp = m.hp;
  const childMax = Math.max(4, motherMax * BIO_SPLIT_RATIO);
  const childHp = clamp(motherHp * BIO_SPLIT_RATIO, 1, childMax);
  m.dead = true;

  const bio = ATTRS[ATTR_INDEX['bio']];
  attrBurst(m.x, m.y, bio, 1.4, 'boom');
  rings.push({ x: m.x, y: m.y, r: m.r * 1.7, max: m.r * 4.4, life: 0.5, max_life: 0.5, color: bio.glow, w: 3.4 });
  rings.push({ x: m.x, y: m.y, r: m.r * 3.6, max: m.r * 0.8, life: 0.42, max_life: 0.42, color: bio.color, w: 2, inwards: true });
  state.shake = Math.max(state.shake, 5);
  SFX.boom();
  addText(m.x, m.y - m.r - 14, '分裂！', bio.glow, { size: 16, bold: true, life: 1.0, vy: -42 });

  for (let i = 0; i < 2; i++){
    const c = makeEnemy(m.type, state.wave);
    c.maxHp = childMax;
    c.hp = childHp;
    c.r = Math.max(9, m.r * 0.62);
    c.speed = m.speed * 1.16;
    c.canSplit = false;
    c.split = true;
    c.scoreMul = 0.5;
    c.dmgMul = BIO_CHILD_DMG;        // 攻击力减半
    c.weak = m.weak;
    c.resist = m.resist;

    // 沿母体侧向裂开
    const ang = m.bodyAng + (i === 0 ? Math.PI / 2 : -Math.PI / 2);
    let px = m.x + Math.cos(ang) * (m.r * 0.5 + c.r * 0.45);
    let py = m.y + Math.sin(ang) * (m.r * 0.5 + c.r * 0.45);
    if (isSolid(px, py) || isSolid(px + c.r * 0.7, py) || isSolid(px - c.r * 0.7, py)){
      px = m.x + rand(-5, 5); py = m.y + rand(-5, 5);
    }
    c.x = clamp(px, TILE * 1.5, WORLD_W - TILE * 1.5);
    c.y = clamp(py, TILE * 1.5, WORLD_H - TILE * 1.5);
    c.stuckX = c.x; c.stuckY = c.y;
    c.vx = Math.cos(ang) * 150; c.vy = Math.sin(ang) * 150;
    c.bodyAng = m.bodyAng;
    c.turretAng = m.turretAng;
    c.spawnAnim = 0.3;
    c.cd = rand(0.4, 1.1);
    enemies.push(c);
  }
}

function killEnemy(e, attrId){
  if (e.dead) return;
  e.dead = true;
  const attr = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  const isBoss = !!e.def.boss;
  attrKill(e.x, e.y, attr, e.r);
  SFX.kill();
  // 生物幼体只计一半分数与经验，避免分裂变成刷分手段
  const mul = e.scoreMul == null ? 1 : e.scoreMul;
  state.score += Math.round(e.def.score * mul);
  gainXp(Math.round((e.def.xp || 10) * mul));
  player.kills++;
  state.killsByAttr[attrId] = (state.killsByAttr[attrId] || 0) + 1;

  // 重甲者死亡时自爆
  if (e.type === 'armored') explode(e.x, e.y, 76, 22, attrId, false);
  if (isBoss){
    explode(e.x, e.y, 190, 60, attrId, false);
    waveMsg('BOSS 已讨伐', 2);
    addText(e.x, e.y - 40, '+' + e.def.score, '#ffd966', { size: 30, bold: true, life: 1.5, vy: -32 });
  }
  updateHUD();
}

function hurtPlayer(dmg, attrId){
  if (player.dead || player.invuln > 0) return;
  const finalD = dmg * (1 - wsPlayerDefFrac());   // 测试工坊：我方防御力减伤
  player.hp -= finalD;
  player.invuln = 0.22;
  state.shake = Math.max(state.shake, 7);
  SFX.hurt();
  const attr = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  attrBurst(player.x, player.y, attr, 1.1, 'hit');
  addText(player.x + rand(-8, 8), player.y - 26, '-' + Math.round(finalD), '#ff7a8a', { size: 17, bold: true });
  if (state.workshop) player.hp = player.maxHp;   // 测试工坊：我方无限血量，钉满
  updateHUD();
  if (player.hp <= 0 && !state.workshop){
    player.hp = 0;
    player.dead = true;
    explode(player.x, player.y, 130, 0, 'fusion', true);
    gameOver();
  }
}

/* ============================================================
   碰撞
   ============================================================ */
/** 圆形实体与墙体求解：把圆推出墙外 */
function collideWalls(ent){
  const r = ent.r;
  const tx0 = ((ent.x - r) / TILE) | 0, tx1 = ((ent.x + r) / TILE) | 0;
  const ty0 = ((ent.y - r) / TILE) | 0, ty1 = ((ent.y + r) / TILE) | 0;
  for (let ty = ty0; ty <= ty1; ty++){
    for (let tx = tx0; tx <= tx1; tx++){
      if (tileAt(tx, ty) === 0) continue;
      const bx = tx * TILE, by = ty * TILE;
      const nx = clamp(ent.x, bx, bx + TILE);
      const ny = clamp(ent.y, by, by + TILE);
      const dx = ent.x - nx, dy = ent.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      let d = Math.sqrt(d2);
      if (d < 0.0001){
        // 圆心在方块内：沿最短轴弹出
        const cx = bx + TILE / 2, cy = by + TILE / 2;
        if (Math.abs(ent.x - cx) > Math.abs(ent.y - cy)){
          ent.x = ent.x < cx ? bx - r : bx + TILE + r;
        } else {
          ent.y = ent.y < cy ? by - r : by + TILE + r;
        }
        continue;
      }
      const push = (r - d) / d;
      ent.x += dx * push;
      ent.y += dy * push;
      // 抵消朝墙的速度分量
      const nx2 = dx / d, ny2 = dy / d;
      const dot = (ent.vx || 0) * nx2 + (ent.vy || 0) * ny2;
      if (dot < 0){ ent.vx -= nx2 * dot; ent.vy -= ny2 * dot; }
    }
  }
  ent.x = clamp(ent.x, TILE * 0.5, WORLD_W - TILE * 0.5);
  ent.y = clamp(ent.y, TILE * 0.5, WORLD_H - TILE * 0.5);
}
/** 实体间互推 */
function separate(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const rr = a.r + b.r;
  const d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr || d2 < 0.0001) return;
  const d = Math.sqrt(d2);
  const push = (rr - d) / d * 0.5;
  a.x -= dx * push; a.y -= dy * push;
  b.x += dx * push; b.y += dy * push;
}

/* ============================================================
   更新：玩家
   ============================================================ */
function updatePlayer(dt){
  if (player.dead) return;

  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  const mag = Math.hypot(mx, my);
  if (mag > 0){ mx /= mag; my /= mag; }

  const slowMul = player.slow > 0 ? 0.72 : 1;
  const spdMul = player.buffSpeed > 0 ? 2 : 1;   // 天空：移速 +100%
  const sp = player.speed * wsSpeedMul() * slowMul * spdMul;   // 测试工坊：移速倍率
  player.vx = lerp(player.vx, mx * sp, 1 - Math.pow(0.0008, dt));
  player.vy = lerp(player.vy, my * sp, 1 - Math.pow(0.0008, dt));
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  collideWalls(player);

  // 车体朝移动方向，炮塔朝鼠标
  if (mag > 0){
    const target = Math.atan2(my, mx);
    player.bodyAng = angLerp(player.bodyAng, target, 1 - Math.pow(0.0005, dt));
  }
  const aim = Math.atan2(mouse.wy - player.y, mouse.wx - player.x);
  player.turretAng = angLerp(player.turretAng, aim, 1 - Math.pow(0.0000012, dt));

  // 履带烟尘
  if (mag > 0 && Math.random() < 0.4){
    const bx = player.x - Math.cos(player.bodyAng) * 12;
    const by = player.y - Math.sin(player.bodyAng) * 12;
    pushParticle({
      x: bx + rand(-5, 5), y: by + rand(-5, 5),
      vx: rand(-16, 16), vy: rand(-16, 16),
      life: rand(0.3, 0.62), max: 0.62, size: rand(3, 7),
      color: 'rgba(150,155,170,0.42)', type: 'smoke', drag: 2, grav: -12
    });
  }

  player.cd -= dt;
  player.recoil = Math.max(0, player.recoil - dt * 6);
  player.invuln = Math.max(0, player.invuln - dt);
  player.slow = Math.max(0, player.slow - dt);
  // 天空增益：限时 3 秒，必须在此衰减，否则 10% 触发一次后永久 ×2 移速/攻速
  player.buffSpeed = Math.max(0, player.buffSpeed - dt);
  player.buffAtk = Math.max(0, player.buffAtk - dt);
  // 撞墙掉速（避免贴墙抖动）
  if (mouse.down && !state.wsEdit) tryFire();   // 编辑场景时不射击
}

/* ============================================================
   更新：敌人
   ============================================================ */
function blockedAhead(e, ang, dist){
  const px = e.x + Math.cos(ang) * dist;
  const py = e.y + Math.sin(ang) * dist;
  return isSolid(px, py);
}
function updateEnemies(dt){
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if (e.dead){ enemies.splice(i, 1); continue; }

    if (e.spawnAnim > 0){
      e.spawnAnim -= dt;
      continue;                     // 出生保护期不动不开火
    }

    // --- 灼烧 DoT（直接持续显示来源元素的粒子与配色，数量/饱和度增强，取消通用橙底） ---
    if (e.burn > 0){
      const ba = ATTRS[ATTR_INDEX[e.burnAttr] || 0];
      e.burn -= dt;
      e.burnTick -= dt;
      e.burnFx = (e.burnFx || 0) - dt;
      // 持续喷发来源元素粒子（少量高频、配色更亮更饱和）
      if (e.burnFx <= 0){
        e.burnFx = 0.06;
        for (let p = 0; p < 2; p++){
          pushParticle({
            x: e.x + rand(-e.r * 0.7, e.r * 0.7), y: e.y + rand(-e.r * 0.7, e.r * 0.7),
            vx: rand(-22, 22), vy: -rand(40, 95),
            life: rand(0.35, 0.7), max: 0.7, size: rand(3, 6.5),
            color: pick([ba.color, ba.glow, lighten(ba.color, 0.3)]),
            type: 'flame', drag: 1.5, grav: -55, flick: rand(0, TAU)
          });
        }
      }
      if (e.burnTick <= 0){
        e.burnTick = 0.42;
        const dmg = wsScaleEnemyDmg(e.burnDps * 0.42);
        e.hp -= dmg;
        if (state.workshop) e.hp = e.maxHp;        // 测试工坊：无限血量
        addText(e.x + rand(-10, 10), e.y - e.r - 4, String(Math.round(dmg)), ba.glow, { size: 12, life: 0.55 });
        if (e.hp <= 0){ killEnemy(e, e.burnAttr); continue; }
      }
    }
    if (e.slow > 0){ e.slow -= dt; if (e.slow <= 0) e.slowMul = 1; }
    if (e.confuse > 0) e.confuse -= dt;
    if (e.vuln > 0) e.vuln -= dt;
    if (e.shoutT > 0) e.shoutT -= dt;
    // 自由：激怒计时（移速/攻速翻倍，是这个元素 ×5 弱点伤害的代价）
    if (e.rage > 0){
      e.rage -= dt;
      if (Math.random() < 0.35){
        pushParticle({
          x: e.x + rand(-e.r * 0.8, e.r * 0.8), y: e.y + rand(-e.r * 0.6, e.r * 0.6),
          vx: rand(-16, 16), vy: -rand(20, 60),
          life: rand(0.25, 0.55), max: 0.55, size: rand(2, 4),
          color: pick(['#ff9a4d', '#ffd27a', '#cd7f32']), type: 'flame', drag: 1.8, grav: -40, flick: rand(0, TAU)
        });
      }
    }
    // 司南：磁场计时，到期清零（磁极随之失效，可再次被磁化）
    if (e.magT > 0){
      e.magT -= dt;
      if (e.magT <= 0){ e.magT = 0; e.pole = 0; }
    }
    // 赛博：变形动画计时
    if (e.morphT > 0) e.morphT -= dt;

    // --- 墨染：变暗 + 攻击欲望降低 ---
    if (e.ink > 0){
      e.ink = Math.max(0, e.ink - dt);
      // 顺着车体往下的墨滴
      if (Math.random() < 0.32){
        pushParticle({
          x: e.x + rand(-e.r * 0.7, e.r * 0.7), y: e.y + rand(-e.r * 0.4, e.r * 0.6),
          vx: rand(-14, 14), vy: rand(12, 64),
          life: rand(0.35, 0.75), max: 0.75, size: rand(2, 4.5),
          color: '#0b0912', rim: '#ded7ff', type: 'ink',
          drag: 1.2, grav: 240, rot: rand(0, TAU), vr: rand(-3, 3)
        });
      }
    }

    // --- 移动（测试工坊的「固定敌人」跳过自身寻路，仅保留击退/牵引的速度积分）---
    const toP = Math.atan2(player.y - e.y, player.x - e.x);
    let moveAng = toP;
    if (!e.fixed){
      const dToP = dist(e.x, e.y, player.x, player.y);
      // 墨染期间不愿贴身（攻击欲望降低）
      const keepDist = (e.type === 'sniper' ? 340 : (e.type === 'armored' ? 40 : 120)) + (e.ink > 0 ? 150 : 0);
      const etx = clamp((e.x / TILE) | 0, 0, MAP_W - 1);
      const ety = clamp((e.y / TILE) | 0, 0, MAP_H - 1);
      const fd = flowDist[ety * MAP_W + etx];
      const probe = e.r + 20;

      e.avoidTimer -= dt;
      if (e.avoidTimer <= 0){ e.avoidTimer = rand(0.5, 1.3); }

      if (dToP < keepDist){
        // 太近：先后退，受阻则环绕
        moveAng = toP + Math.PI;
        if (blockedAhead(e, moveAng, probe)){
          moveAng = toP + Math.PI / 2 * e.avoidSide;
          if (blockedAhead(e, moveAng, probe)){
            moveAng = toP - Math.PI / 2 * e.avoidSide;
            e.avoidSide *= -1;
          }
        }
      } else if (dToP < keepDist + 110 && fd >= 0 && fd <= 2){
        // 近距离且通视：环绕走位
        moveAng = toP + Math.PI / 2 * e.avoidSide * 0.72 + (e.type === 'scout' ? 0.35 : 0);
      } else if (fd > 0){
        // 流场导航：朝梯度下降的下一格中心走
        const nxt = flowNext(etx, ety);
        if (nxt){
          const c = centerOf(nxt.x, nxt.y);
          moveAng = Math.atan2(c.y - e.y, c.x - e.x);
        } else moveAng = toP;
      } else {
        moveAng = toP;                       // 同格或不可达：直冲
      }

      // 局部避障（防贴角）
      if (blockedAhead(e, moveAng, probe)){
        const a1 = moveAng + 0.85 * e.avoidSide;
        const a2 = moveAng - 0.85 * e.avoidSide;
        if (!blockedAhead(e, a1, probe)) moveAng = a1;
        else if (!blockedAhead(e, a2, probe)){ moveAng = a2; e.avoidSide *= -1; }
        else moveAng = toP;
      }

      // 卡死检测：长时间几乎不动就随机换向
      e.stuckTimer += dt;
      if (e.stuckTimer > 0.9){
        if (dist2(e.x, e.y, e.stuckX, e.stuckY) < 144){   // 12px 内
          e.avoidSide *= -1;
          moveAng = rand(0, TAU);
        }
        e.stuckTimer = 0;
        e.stuckX = e.x; e.stuckY = e.y;
      }

      // Boss 碾碎挡路的砖墙（避免大体型卡死）
      if (e.def.boss){
        const r0 = Math.ceil(e.r / TILE) + 1;
        for (let yy = ety - r0; yy <= ety + r0; yy++){
          for (let xx = etx - r0; xx <= etx + r0; xx++){
            if (tileAt(xx, yy) !== 1) continue;
            const c = centerOf(xx, yy);
            if (dist2(c.x, c.y, e.x, e.y) < (e.r + TILE * 0.5) * (e.r + TILE * 0.5)) damageWall(xx, yy, 3);
          }
        }
      }

      e.wobble += dt * 2.4;
      // 激怒：移速 ×2（与减速并存时是相乘关系，减速仍然生效）
      const spd = e.speed * e.slowMul * (1 + Math.sin(e.wobble) * 0.06) * (e.rage > 0 ? 2 : 1);
      e.vx = lerp(e.vx, Math.cos(moveAng) * spd, 1 - Math.pow(0.002, dt));
      e.vy = lerp(e.vy, Math.sin(moveAng) * spd, 1 - Math.pow(0.002, dt));
    }
    // 气动击退 / 司南牵引 的额外速度衰减（固定敌人也保留，使外力可推动）
    e.vx *= Math.pow(0.06, dt);
    e.vy *= Math.pow(0.06, dt);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    collideWalls(e);

    e.bodyAng = angLerp(e.bodyAng, moveAng, 1 - Math.pow(0.002, dt));
    // 混乱：炮塔转向随机队友（误伤友军）；否则瞄准玩家
    let aimAng = toP;
    if (e.confuse > 0){
      const mates = enemies.filter(function(o){ return o !== e && !o.dead; });
      if (mates.length){ const m = pick(mates); aimAng = Math.atan2(m.y - e.y, m.x - e.x); }
    }
    // 墨染期间炮塔转动明显迟钝
    e.turretAng = angLerp(e.turretAng, aimAng, 1 - Math.pow(e.ink > 0 ? 0.06 : 0.0004, dt));
    e.hitFlash = Math.max(0, e.hitFlash - dt * 4.5);

    // --- 开火 ---
    e.cd -= dt;
    if (e.cd <= 0){
      const fireAng = aimAng;
      const ff = e.confuse > 0;
      const reach = ff ? 9999 : 780;
      const tgtX = ff ? e.x + Math.cos(fireAng) * 60 : player.x;
      const tgtY = ff ? e.y + Math.sin(fireAng) * 60 : player.y;
      if (dist(e.x, e.y, tgtX, tgtY) < reach && Math.abs(angDiff(e.turretAng, fireAng)) < 0.32){
        // 墨染：射击间隔大幅拉长（出手频次降到约 4 成）；自由激怒：攻速 ×2（间隔减半）
        e.cd = e.def.cd * rand(0.8, 1.25) * (e.ink > 0 ? 2.4 : 1) * (e.rage > 0 ? 0.5 : 1);
        enemyFire(e, fireAng, ff);
      } else {
        e.cd = 0;   // 还未对准：下一帧继续尝试
      }
    }
  }
  // 敌人互相分离
  for (let i = 0; i < enemies.length; i++){
    for (let j = i + 1; j < enemies.length; j++){
      separate(enemies[i], enemies[j]);
    }
  }
}

function enemyFire(e, ang, ff){
  const spread = e.type === 'boss' ? 0.34 : 0.075;
  const shots = e.def.boss ? 5 : (e.type === 'armored' ? 2 : 1);
  for (let i = 0; i < shots; i++){
    const a = ang + (shots > 1 ? (i - (shots - 1) / 2) * spread : rand(-spread, spread));
    const mx = e.x + Math.cos(a) * (e.r + 8);
    const my = e.y + Math.sin(a) * (e.r + 8);
    ebullets.push({
      x: mx, y: my, px: mx, py: my,
      vx: Math.cos(a) * e.def.bspd,
      vy: Math.sin(a) * e.def.bspd,
      r: e.def.boss ? 7 : 5,
      dmg: e.def.bdmg * (e.dmgMul == null ? 1 : e.dmgMul) * (e.atkMul == null ? 1 : e.atkMul),
      // 敌人用自身弱点属性开火（弱点有 3 个，随机取一个，让弹幕颜色有变化）
      attr: (e.weak && e.weak.length) ? pick(e.weak) : ATTRS[0].id,
      ff: !!ff,                            // 混乱误伤：命中友军而非玩家
      life: 2.6,
      dead: false
    });
  }
  for (let i = 0; i < 5; i++){
    const a = ang + rand(-0.35, 0.35);
    pushParticle({
      x: e.x + Math.cos(ang) * (e.r + 8), y: e.y + Math.sin(ang) * (e.r + 8),
      vx: Math.cos(a) * rand(70, 190), vy: Math.sin(a) * rand(70, 190),
      life: rand(0.08, 0.2), max: 0.2, size: rand(2, 4),
      color: '#ffd0a0', type: 'spark', drag: 5
    });
  }
  SFX.tone(e.def.boss ? 150 : 260, 0.08, 'square', 0.09, 90);
}

/* ============================================================
   更新：子弹
   ============================================================ */
/* ---------------- 篮球：反弹 ----------------
   用「分轴试探」求墙面法向：把新位置拆成 (新x, 旧y) 与 (旧x, 新y)，
   哪个轴单独撞墙，法向就落在哪个轴上。比直接读格子邻居更稳，
   在墙角斜撞时也不会算出零向量。
------------------------------------------- */
function wallBounceNormal(b){
  const hitX = isSolid(b.x, b.py);   // 仅 X 位移造成的碰撞
  const hitY = isSolid(b.px, b.y);   // 仅 Y 位移造成的碰撞
  if (hitX && !hitY) return { nx: b.vx > 0 ? -1 : 1, ny: 0 };
  if (hitY && !hitX) return { nx: 0, ny: b.vy > 0 ? -1 : 1 };
  // 墙角同时撞：沿速度较大的那个轴反弹
  if (Math.abs(b.vx) >= Math.abs(b.vy)) return { nx: b.vx > 0 ? -1 : 1, ny: 0 };
  return { nx: 0, ny: b.vy > 0 ? -1 : 1 };
}
/** 速度关于法向 (nx,ny) 做镜面反射，并同步 b.ang（拖尾与击退方向都依赖它） */
function reflectVel(b, nx, ny){
  const dot = b.vx * nx + b.vy * ny;
  b.vx -= 2 * dot * nx;
  b.vy -= 2 * dot * ny;
  b.ang = Math.atan2(b.vy, b.vx);
}
/** 从目标表面弹开，并把子弹推到表面外，避免下一帧立刻重复命中 */
function bounceOffTarget(b, cx, cy, rad){
  let nx = b.x - cx, ny = b.y - cy;
  const d = Math.hypot(nx, ny);
  if (d < 0.001){ nx = -Math.cos(b.ang); ny = -Math.sin(b.ang); }
  else { nx /= d; ny /= d; }
  reflectVel(b, nx, ny);
  b.x = cx + nx * (rad + 1.5);
  b.y = cy + ny * (rad + 1.5);
}

function updateBullets(dt){
  // --- 玩家子弹 ---
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if (b.life <= 0){ bullets.splice(i, 1); continue; }

    // 司南：取消「弹幕吸引/排斥敌方坦克」的机制（按 JSON 要求）。
    // 磁极 b.pole 仅用于弹丸/拖尾上色，坦克之间的磁极作用仍由敌方 magT 决定。

    // 出界（篮球视为撞到场地边界，同样反弹）
    if (b.x < TILE * 0.5 || b.y < TILE * 0.5 || b.x > WORLD_W - TILE * 0.5 || b.y > WORLD_H - TILE * 0.5){
      if (b.bounce > 0){
        b.bounce--;
        b.life = Math.max(b.life, 4.0);   // 反弹中的弹幕保活 4 秒（足够跑完全场再反弹）
        const nx = (b.x < TILE * 0.5 || b.x > WORLD_W - TILE * 0.5) ? (b.vx > 0 ? -1 : 1) : 0;
        const ny = nx ? 0 : (b.vy > 0 ? -1 : 1);
        reflectVel(b, nx, ny);
        b.x = clamp(b.x, TILE * 0.5 + 2, WORLD_W - TILE * 0.5 - 2);
        b.y = clamp(b.y, TILE * 0.5 + 2, WORLD_H - TILE * 0.5 - 2);
        attrBurst(b.x, b.y, ATTRS[b.attrIdx], 0.5, 'hit');
        continue;
      }
      onBulletEnd(b, b.x, b.y, true);
      bullets.splice(i, 1);
      continue;
    }

    // 撞墙
    if (isSolid(b.x, b.y)){
      if (b.bounce > 0){
        b.bounce--;
        b.life = Math.max(b.life, 4.0);   // 反弹中的弹幕保活 4 秒
        const n = wallBounceNormal(b);
        reflectVel(b, n.nx, n.ny);
        b.x += n.nx * 3; b.y += n.ny * 3;
        attrBurst(b.x, b.y, ATTRS[b.attrIdx], 0.55, 'hit');
        // 反弹后仍嵌在墙里（薄墙/斜角）就直接销毁，避免抖动卡死
        if (isSolid(b.x, b.y)){ bullets.splice(i, 1); }
        continue;
      }
      const tx = (b.x / TILE) | 0, ty = (b.y / TILE) | 0;
      const ammo = AMMO[AMMO_INDEX[b.ammo]];
      const at = ATTRS[b.attrIdx] || {};
      // 巨石：对掩体破坏力 +100%
      if (ammo.wallBreak) damageWall(tx, ty, ammo.wallBreak * (at.wallBreakMul || 1));
      attrBurst(b.x, b.y, at.id ? at : ATTRS[0], 0.8, 'hit');
      onBulletEnd(b, b.x, b.y, false);
      bullets.splice(i, 1);
      continue;
    }

    // 命中敌人
    let hit = false;
    for (let k = 0; k < enemies.length; k++){
      const e = enemies[k];
      if (e.dead || e.spawnAnim > 0) continue;
      if (b.hitSet && b.hitSet[e.id]) continue;
      if (dist2(b.x, b.y, e.x, e.y) < (e.r + b.r) * (e.r + b.r)){
        const r = computeDamage(b.dmg, b.attr, e, b.glyphIdx);
        hurtEnemy(e, r.dmg, b.attr, b.x, b.y, r.crit, r.tag, false);
        // 司南需要从子弹上把磁极带进命中回调
        applyAttrEffect(b.attr, e, b.x, b.y, r.dmg, b.ang, b.pole ? { pole: b.pole } : null);
        onBulletEnd(b, b.x, b.y, false);
        // 命中过就记账：反弹回来不应立刻再打同一个目标，否则会在两点间无限弹
        if (!b.hitSet) b.hitSet = Object.create(null);
        b.hitSet[e.id] = 1;

        if (b.pierce > 0){
          b.pierce--;                       // 穿透优先：先直穿，穿完再谈反弹
        } else if (b.bounce > 0){
          b.bounce--;
          bounceOffTarget(b, e.x, e.y, e.r + b.r);
          break;                            // 本帧不再检测其它目标
        } else {
          hit = true;
        }
        break;
      }
    }
    if (hit){ bullets.splice(i, 1); continue; }

    // 拖尾（按元素走各自的视觉语言）
    const at = ATTRS[b.attrIdx];
    if (at.id === 'magnet'){
      // 司南：红蓝按磁极上色，一眼能看出这一发是 N 还是 S
      pushParticle({
        x: b.x, y: b.y, vx: rand(-14, 14), vy: rand(-14, 14),
        life: rand(0.12, 0.28), max: 0.28, size: b.r * 1.1,
        color: b.pole > 0 ? at.color : (at.color2 || at.color), type: 'spark', drag: 4
      });
    } else if (at.id === 'math'){
      // 数学：拖尾白色发光字形，与弹丸上的字形一致
      if (Math.random() < 0.7){
        pushParticle({
          x: b.x, y: b.y, vx: rand(-10, 10), vy: rand(-10, 10),
          life: rand(0.25, 0.5), max: 0.5, size: b.r * 2.4,
          color: '#ffffff', type: 'glyph', ch: b.glyph || 'e', drag: 3
        });
      }
    } else if (at.id === 'magic'){
      // 魔术：红黑白方块 + 冒烟
      if (Math.random() < 0.7){
        const tri = ['#e8342e', '#161018', '#ffffff'];
        pushParticle({
          x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20),
          life: rand(0.2, 0.45), max: 0.45, size: rand(2.5, 5.5),
          color: tri[(Math.random() * 3) | 0], type: 'block',
          rot: rand(0, TAU), vr: rand(-8, 8), drag: 3, grav: 160
        });
      }
      if (Math.random() < 0.3){
        pushParticle({
          x: b.x, y: b.y, vx: rand(-12, 12), vy: rand(-18, -4),
          life: rand(0.35, 0.7), max: 0.7, size: rand(3, 7),
          color: 'rgba(24,18,26,0.5)', type: 'smoke', drag: 1.4, grav: -20
        });
      }
    } else if (at.id === 'cyber'){
      // 赛博：拖尾挂着数据流乱码
      if (Math.random() < 0.6){
        pushParticle({
          x: b.x, y: b.y, vx: rand(-10, 10), vy: rand(-10, 10),
          life: rand(0.2, 0.45), max: 0.45, size: rand(4, 8),
          color: Math.random() < 0.5 ? at.color : (at.color2 || at.color),
          type: 'glyph', ch: GLYPH_CHARS[(Math.random() * GLYPH_CHARS.length) | 0], drag: 3
        });
      }
    } else if (at.id === 'earth'){
      // 地球：又长又浓的白色蒸汽拖尾
      if (Math.random() < 0.92){
        pushParticle({
          x: b.x, y: b.y, vx: rand(-16, 16), vy: -rand(24, 78),
          life: rand(0.5, 1.0), max: 1.0, size: rand(5, 10),
          color: '#ffffff', type: 'smoke', drag: 1.6, grav: -28
        });
      }
    } else if (Math.random() < 0.75){
      pushParticle({
        x: b.x, y: b.y, vx: rand(-14, 14), vy: rand(-14, 14),
        life: rand(0.1, 0.24), max: 0.24, size: b.r * 0.8,
        color: at.color, type: 'spark', drag: 4
      });
    }
  }

  // --- 敌人子弹 ---
  for (let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0){ ebullets.splice(i, 1); continue; }
    if (isSolid(b.x, b.y) || b.x < 0 || b.y < 0 || b.x > WORLD_W || b.y > WORLD_H){
      attrBurst(b.x, b.y, ATTRS[ATTR_INDEX[b.attr] || 0], 0.55, 'hit');
      ebullets.splice(i, 1);
      continue;
    }
    if (b.ff){
      // 混乱误伤：命中其他敌人（友军）
      let hitE = null;
      for (let k = 0; k < enemies.length; k++){
        const e = enemies[k];
        if (e.dead || e.spawnAnim > 0) continue;
        if (dist2(b.x, b.y, e.x, e.y) < (e.r + b.r) * (e.r + b.r)){ hitE = e; break; }
      }
      if (hitE){
        const r = computeDamage(b.dmg, b.attr, hitE);
        hurtEnemy(hitE, r.dmg, b.attr, b.x, b.y, r.crit, r.tag, false);
        applyAttrEffect(b.attr, hitE, b.x, b.y, r.dmg, Math.atan2(b.vy, b.vx));
        ebullets.splice(i, 1);
        continue;
      }
    } else if (!player.dead && dist2(b.x, b.y, player.x, player.y) < (player.r + b.r) * (player.r + b.r)){
      hurtPlayer(b.dmg, b.attr);
      if (b.attr === 'glacio') player.slow = Math.max(player.slow, 1.0);
      ebullets.splice(i, 1);
      continue;
    }
    if (Math.random() < 0.5){
      pushParticle({
        x: b.x, y: b.y, vx: rand(-10, 10), vy: rand(-10, 10),
        life: rand(0.08, 0.2), max: 0.2, size: b.r * 0.7,
        color: (ATTRS[ATTR_INDEX[b.attr]] || ATTRS[0]).color, type: 'spark', drag: 4
      });
    }
  }
}
/** 子弹生命周期结束（命中/撞墙）时的弹药专属效果 */
function onBulletEnd(b, x, y, outOfRange){
  const ammo = AMMO[AMMO_INDEX[b.ammo]];
  const attrId = b.attr;
  if (ammo.splash){
    explode(x, y, ammo.splash, ammo.splashDmg, attrId, false);
  }
  if (ammo.burn){
    spawnZone(x, y, ammo.burn.r, ammo.burn.dps, ammo.burn.dur, attrId);
  }
}

/* ============================================================
   吸血蝙蝠（染血特性）
   ============================================================ */
function summonBat(x, y){
  if (bats.length > 24) return;
  // 吸血蝙蝠固定为血染元素：锁定 attr，避免切换元素/武器后误带其它元素特性
  bats.push({ x: x, y: y, vx: rand(-60, 60), vy: rand(-60, 60), life: BAT_DUR, t: 0, hitCd: 0, flap: rand(0, TAU), attr: 'blood' });
}
function updateBats(dt){
  for (let i = bats.length - 1; i >= 0; i--){
    const b = bats[i];
    b.life -= dt; b.t += dt; b.flap += dt * 18; b.hitCd -= dt;
    if (b.life <= 0){ bats.splice(i, 1); continue; }
    let best = null, bd = 1e9;
    for (let k = 0; k < enemies.length; k++){
      const e = enemies[k];
      if (e.dead || e.spawnAnim > 0) continue;
      const d = dist2(b.x, b.y, e.x, e.y);
      if (d < bd){ bd = d; best = e; }
    }
    if (best){
      const ang = Math.atan2(best.y - b.y, best.x - b.x);
      const sp = 240;
      b.vx = lerp(b.vx, Math.cos(ang) * sp, 1 - Math.pow(0.02, dt));
      b.vy = lerp(b.vy, Math.sin(ang) * sp, 1 - Math.pow(0.02, dt));
      if (b.hitCd <= 0 && dist2(b.x, b.y, best.x, best.y) < (best.r + 14) * (best.r + 14)){
        b.hitCd = 0.35;
        const dmg = 9 * lvlDmgMul();
        const r = computeDamage(dmg, b.attr, best);
        hurtEnemy(best, r.dmg, b.attr, best.x, best.y, false, '', false);
        if (!player.dead){
          const heal = Math.min(player.maxHp - player.hp, dmg * 0.25);
          if (heal > 0) player.hp += heal;
        }
        addText(best.x, best.y - best.r - 6, '吸血', '#ff2d2d', { size: 11, life: 0.5 });
      }
    } else {
      const ang = state.time * 1.5 + i;
      const tx = player.x + Math.cos(ang) * 40, ty = player.y + Math.sin(ang) * 40;
      b.vx = lerp(b.vx, (tx - b.x) * 3, 1 - Math.pow(0.02, dt));
      b.vy = lerp(b.vy, (ty - b.y) * 3, 1 - Math.pow(0.02, dt));
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
}
function drawBats(){
  bats.forEach(function(b){
    ctx.save();
    ctx.translate(b.x, b.y);
    const f = Math.sin(b.flap) * 0.5;
    ctx.fillStyle = '#1a0d14';
    ctx.strokeStyle = '#ff5c8a';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-12, -6 - f * 6, -18, 2 + f * 4);
    ctx.quadraticCurveTo(-10, 2, 0, 2);
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(12, -6 - f * 6, 18, 2 + f * 4);
    ctx.quadraticCurveTo(10, 2, 0, 2);
    ctx.fill();
    ctx.fillStyle = '#ff2d2d';
    ctx.beginPath(); ctx.arc(-2, -1, 1.2, 0, TAU); ctx.arc(2, -1, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
  });
}

/* ============================================================
   立场圈冲击波（中距 · 自身中心 · 连续释放）
   ============================================================ */
function fireShock(x, y, ammo, attr){
  const gi = (attr.id === 'math') ? player.mathDigit : -1;
  shocks.push({ x: x, y: y, r: 0, max: ammo.range, life: 0.55, max_life: 0.55,
    speed: ammo.range / 0.55, dmg: ammo.dmg, attr: attr.id, band: ammo.waveW || 50,
    hitSet: Object.create(null), blockSet: Object.create(null), glyphIdx: gi });
}
function updateShocks(dt){
  for (let i = shocks.length - 1; i >= 0; i--){
    const s = shocks[i];
    s.life -= dt;
    s.r += s.speed * dt;
    if (s.life <= 0 || s.r >= s.max){ shocks.splice(i, 1); continue; }
    const lo = s.r - s.band, hi = s.r + s.band;
    for (let k = 0; k < enemies.length; k++){
      const e = enemies[k];
      if (e.dead || e.spawnAnim > 0 || s.hitSet[e.id]) continue;
      const d = dist(e.x, e.y, s.x, s.y);
      if (d >= lo && d <= hi){
        s.hitSet[e.id] = 1;
        const falloff = clamp(1 - (s.r / s.max) * 0.4, 0.6, 1);
        const r = computeDamage(s.dmg * falloff, s.attr, e, s.glyphIdx >= 0 ? s.glyphIdx : null);
        hurtEnemy(e, r.dmg, s.attr, e.x, e.y, r.crit, r.tag, false);
        applyAttrEffect(s.attr, e, e.x, e.y, r.dmg, Math.atan2(e.y - s.y, e.x - s.x));
      }
    }
    // 立场波：30% 概率阻挡经过波带的敌方弹幕（每弹仅判定一次，避免每帧叠加导致接近 100%）
    const sa = ATTRS[ATTR_INDEX[s.attr] || 0];
    if (!s.blockSet) s.blockSet = Object.create(null);
    for (let k = ebullets.length - 1; k >= 0; k--){
      const b = ebullets[k];
      // 已判过的弹跳过（保证每弹恰好一次 30% 掷骰）
      if (s.blockSet[b.id]) continue;
      const d = dist(b.x, b.y, s.x, s.y);
      if (d >= lo && d <= hi){
        s.blockSet[b.id] = 1;          // 标记已判
        if (Math.random() < 0.30){
          ebullets.splice(k, 1);
          rings.push({ x: b.x, y: b.y, r: 4, max: 22, life: 0.22, max_life: 0.22, color: sa.glow, w: 2 });
          pushParticle({ x: b.x, y: b.y, vx: rand(-40, 40), vy: rand(-40, 40),
            life: rand(0.2, 0.4), max: 0.4, size: rand(2, 4), color: sa.glow, type: 'spark', drag: 4 });
        }
      }
    }
  }
}
function drawShocks(){
  shocks.forEach(function(s){
    const t = clamp(s.life / s.max_life, 0, 1);
    const col = (ATTRS[ATTR_INDEX[s.attr]] || ATTRS[0]).color;     // 立场圈用元素原色（避免多色轮替闪白）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 * t + 0.1;
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.22 * t;
    ctx.strokeStyle = lighten(col, 0.35); ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
    ctx.restore();
  });
}

/** 彩虹元素：每帧推进色相，使所有用到其 color/glow 的特效循环虹彩 */
function updateRainbow(){
  const rb = ATTRS[ATTR_INDEX['rainbow']];
  if (!rb) return;
  const h = (state.time * 90) % 360;
  rb.color = 'hsl(' + (h | 0) + ',100%,62%)';
  rb.glow = 'hsl(' + (((h + 40) % 360) | 0) + ',100%,72%)';
}

/* ============================================================
   更新：火场 / 粒子 / 环 / 弧 / 文本
   ============================================================ */
function updateZones(dt){
  for (let i = zones.length - 1; i >= 0; i--){
    const z = zones[i];
    z.life -= dt;
    if (z.life <= 0){ zones.splice(i, 1); continue; }
    z.tick -= dt;
    const attr = ATTRS[ATTR_INDEX[z.attrId]] || ATTRS[0];
    // 火焰粒子
    if (Math.random() < 0.9){
      const a = rand(0, TAU), rr = Math.sqrt(Math.random()) * z.r;
      pushParticle({
        x: z.x + Math.cos(a) * rr, y: z.y + Math.sin(a) * rr,
        vx: rand(-14, 14), vy: -rand(28, 78),
        life: rand(0.28, 0.62), max: 0.62, size: rand(3, 8),
        color: pick(['#fff3c4', '#ffb066', attr.color, '#ff3d1a']),
        type: 'flame', drag: 1.5, grav: -60, flick: rand(0, TAU)
      });
    }
    if (z.tick <= 0){
      z.tick = 0.4;
      enemies.forEach(function(e){
        if (e.dead || e.spawnAnim > 0) return;
        if (dist2(e.x, e.y, z.x, z.y) < (z.r + e.r) * (z.r + e.r)){
          const r = computeDamage(z.dps * 0.4, z.attrId, e);
          hurtEnemy(e, r.dmg, z.attrId, e.x, e.y, r.crit, r.tag, true);
        }
      });
      if (!player.dead && dist2(player.x, player.y, z.x, z.y) < z.r * z.r){
        hurtPlayer(z.dps * 0.16, z.attrId);
      }
    }
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    const drag = p.drag || 0;
    if (drag){ const f = Math.pow(1 / (1 + drag), dt * 6); p.vx *= f; p.vy *= f; }
    if (p.grav) p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.vr) p.rot = (p.rot || 0) + p.vr * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt;
    if (r.life <= 0){ rings.splice(i, 1); continue; }
    const t = 1 - r.life / r.max_life;
    if (r.from == null) r.from = r.r;              // 首帧锁定起始半径
    r.r = lerp(r.from, r.max, 1 - Math.pow(1 - t, 2));   // 缓出扩张/收缩
  }
  for (let i = arcs.length - 1; i >= 0; i--){
    arcs[i].life -= dt;
    if (arcs[i].life <= 0) arcs.splice(i, 1);
  }
  for (let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.life -= dt;
    if (t.life <= 0){ texts.splice(i, 1); continue; }
    t.y += t.vy * dt;
    t.x += t.vx * dt;
    t.vy *= Math.pow(0.12, dt);
    t.vx *= Math.pow(0.2, dt);
  }
}

/* ============================================================
   画布
   ============================================================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
let minimapCv = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = cvs.clientWidth || 1280;
  VH = cvs.clientHeight || 720;
  cvs.width = Math.max(1, Math.floor(VW * DPR));
  cvs.height = Math.max(1, Math.floor(VH * DPR));
  updateCam();
}

function updateCam(){
  const w = WORLD_W, h = WORLD_H;
  let cx = player ? player.x - VW / 2 : 0;
  let cy = player ? player.y - VH / 2 : 0;
  if (w <= VW) cx = (w - VW) / 2; else cx = clamp(cx, 0, w - VW);
  if (h <= VH) cy = (h - VH) / 2; else cy = clamp(cy, 0, h - VH);
  cam.x = cx; cam.y = cy;
}

/* ============================================================
   绘制工具
   ============================================================ */
function rrect(c, x, y, w, h, r){
  const rr = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rr, y);
  c.lineTo(x + w - rr, y);
  c.quadraticCurveTo(x + w, y, x + w, y + rr);
  c.lineTo(x + w, y + h - rr);
  c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  c.lineTo(x + rr, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - rr);
  c.lineTo(x, y + rr);
  c.quadraticCurveTo(x, y, x + rr, y);
  c.closePath();
}
function glowDot(c, x, y, r, color, inner){
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.32;
  c.fillStyle = color;
  c.beginPath(); c.arc(x, y, r * 2.5, 0, TAU); c.fill();
  c.globalAlpha = 1;
  c.fillStyle = inner || '#ffffff';
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.globalCompositeOperation = 'source-over';
}

/** 画一辆坦克（车体 + 炮塔分离） */
function drawTank(x, y, bodyAng, turretAng, r, o){
  // --- 车体 ---
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(bodyAng);
  // 履带
  ctx.fillStyle = o.track;
  rrect(ctx, -r * 1.12, -r * 1.02, r * 2.24, r * 0.46, r * 0.16); ctx.fill();
  rrect(ctx, -r * 1.12, r * 0.56, r * 2.24, r * 0.46, r * 0.16); ctx.fill();
  // 履带节
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  for (let i = -2; i <= 2; i++){
    ctx.fillRect(i * r * 0.44 - r * 0.05, -r * 1.02, r * 0.1, r * 0.46);
    ctx.fillRect(i * r * 0.44 - r * 0.05, r * 0.56, r * 0.1, r * 0.46);
  }
  // 车身
  const g = ctx.createLinearGradient(-r * 0.9, -r * 0.8, r * 0.9, r * 0.8);
  g.addColorStop(0, o.body2);
  g.addColorStop(1, o.body);
  ctx.fillStyle = g;
  rrect(ctx, -r * 0.86, -r * 0.76, r * 1.72, r * 1.52, r * 0.34);
  ctx.fill();
  ctx.strokeStyle = o.outline;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // 车顶高光
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  rrect(ctx, -r * 0.7, -r * 0.66, r * 1.4, r * 0.42, r * 0.18); ctx.fill();
  ctx.restore();

  // --- 炮塔 ---
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(turretAng);
  // 炮管
  const bl = o.barrelLen || r * 1.72;
  ctx.fillStyle = o.barrel;
  rrect(ctx, -r * 0.1, -r * 0.17, bl, r * 0.34, r * 0.1); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
  // 炮口制退器
  ctx.fillStyle = o.body2;
  rrect(ctx, bl - r * 0.24, -r * 0.22, r * 0.3, r * 0.44, r * 0.08); ctx.fill();
  // 炮塔主体
  ctx.fillStyle = o.turret;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = o.outline; ctx.lineWidth = 1.4; ctx.stroke();
  // 属性核心（随属性变色）
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = o.core;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.3;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.44, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ============================================================
   渲染各层
   ============================================================ */
function drawGround(){
  ctx.fillStyle = '#090a0f';
  ctx.fillRect(0, 0, VW, VH);
  const x0 = Math.floor(cam.x / TILE), x1 = Math.ceil((cam.x + VW) / TILE);
  const y0 = Math.floor(cam.y / TILE), y1 = Math.ceil((cam.y + VH) / TILE);
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= x1; x++){ ctx.moveTo(x * TILE - cam.x, 0); ctx.lineTo(x * TILE - cam.x, VH); }
  for (let y = y0; y <= y1; y++){ ctx.moveTo(0, y * TILE - cam.y); ctx.lineTo(VW, y * TILE - cam.y); }
  ctx.stroke();
  // 每 4 格加粗
  ctx.strokeStyle = 'rgba(255,255,255,.055)';
  ctx.beginPath();
  for (let x = x0; x <= x1; x++){ if (x % 4) continue; ctx.moveTo(x * TILE - cam.x, 0); ctx.lineTo(x * TILE - cam.x, VH); }
  for (let y = y0; y <= y1; y++){ if (y % 4) continue; ctx.moveTo(0, y * TILE - cam.y); ctx.lineTo(VW, y * TILE - cam.y); }
  ctx.stroke();
}

function drawWalls(){
  const x0 = Math.max(0, Math.floor(cam.x / TILE)), x1 = Math.min(MAP_W - 1, Math.ceil((cam.x + VW) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE)), y1 = Math.min(MAP_H - 1, Math.ceil((cam.y + VH) / TILE));
  for (let ty = y0; ty <= y1; ty++){
    for (let tx = x0; tx <= x1; tx++){
      const t = grid[ty][tx];
      if (t === 0) continue;
      const w = wallRefAt(tx, ty);
      const bx = tx * TILE, by = ty * TILE;
      if (t === 2){
        // 钢墙
        ctx.fillStyle = '#3d4451';
        ctx.fillRect(bx, by, TILE, TILE);
        ctx.fillStyle = '#525b6b';
        ctx.fillRect(bx + 2, by + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = 'rgba(255,255,255,.10)';
        ctx.fillRect(bx + 2, by + 2, TILE - 4, 4);
        ctx.strokeStyle = 'rgba(0,0,0,.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 1, by + 1, TILE - 2, TILE - 2);
        ctx.strokeStyle = 'rgba(255,255,255,.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + 6, by + TILE - 6); ctx.lineTo(bx + TILE - 6, by + 6);
        ctx.stroke();
      } else {
        // 砖墙
        const hp = w ? w.hp : 3;
        ctx.fillStyle = hp >= 3 ? '#8d4a2b' : hp === 2 ? '#7a4025' : '#63331d';
        ctx.fillRect(bx, by, TILE, TILE);
        ctx.fillStyle = hp >= 3 ? '#a85a34' : hp === 2 ? '#8f4a2a' : '#70361f';
        for (let r = 0; r < 4; r++){
          const oy = by + r * 11;
          const off = (r % 2) ? -11 : 0;
          for (let c = -1; c < 3; c++){
            ctx.fillRect(bx + c * 22 + off + 2, oy + 2, 19, 8);
          }
        }
        // 裂纹
        if (hp < 3){
          ctx.strokeStyle = 'rgba(0,0,0,.5)';
          ctx.lineWidth = hp === 1 ? 2.2 : 1.4;
          ctx.beginPath();
          ctx.moveTo(bx + 8, by + 6);
          ctx.lineTo(bx + TILE * 0.55, by + TILE * 0.5);
          ctx.lineTo(bx + TILE - 10, by + TILE * 0.34);
          if (hp === 1){
            ctx.moveTo(bx + TILE * 0.55, by + TILE * 0.5);
            ctx.lineTo(bx + TILE * 0.4, by + TILE - 5);
          }
          ctx.stroke();
        }
      }
      if (w && w.hitFlash > 0){
        ctx.fillStyle = 'rgba(255,255,255,' + (w.hitFlash * 0.42) + ')';
        ctx.fillRect(bx, by, TILE, TILE);
        w.hitFlash = Math.max(0, w.hitFlash - 0.06);
      }
    }
  }
}

function drawZones(){
  zones.forEach(function(z){
    const attr = ATTRS[ATTR_INDEX[z.attrId]] || ATTRS[0];
    const fade = clamp(z.life / 0.6, 0, 1);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    g.addColorStop(0, hexToRgba(attr.color, 0.34 * fade));
    g.addColorStop(0.6, hexToRgba(attr.glow, 0.22 * fade));
    g.addColorStop(1, hexToRgba(attr.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = hexToRgba(attr.glow, 0.4 * fade);
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  });
}

// 弱点 / 抗性 emoji：用元素原生 emoji 直接绘制（保留系统 emoji 多色字色，不做强制染色）。
function drawEmojiTag(emoji, cx, cy, px, ringColor){
  ctx.save();
  // 中性深色圆盘衬底：纯对比用，不改动 emoji 自身颜色
  const r = px * 0.62;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(8,10,16,0.78)';
  ctx.fill();
  if (ringColor){
    ctx.lineWidth = Math.max(2, px * 0.10);
    ctx.strokeStyle = ringColor;
    ctx.stroke();
  }
  ctx.font = Math.floor(px) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy);
  ctx.restore();
}

function drawEnemies(){
  enemies.forEach(function(e){
    // 出生保护：闪烁
    if (e.spawnAnim > 0){
      const t = 1 - e.spawnAnim / 0.55;
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(t * 34) * 0.25;
      ctx.strokeStyle = '#ff9db0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.6 - t * 0.6), 0, TAU); ctx.stroke();
      ctx.restore();
      return;
    }
    const wa = ATTRS[ATTR_INDEX[e.weak   && e.weak.length   ? e.weak[0]   : 'physical']] || ATTRS[0];
    const ra = ATTRS[ATTR_INDEX[e.resist && e.resist.length ? e.resist[0] : 'physical']] || ATTRS[0];
    const flash = e.hitFlash;
    // 墨染：整体压暗，剩余时间不足 1.2s 时逐渐褪回
    const inked = e.ink > 0;
    const ik = inked ? clamp(e.ink / 1.2, 0, 1) : 0;
    const dim = function(hex){ return inked ? shadeHex(hex, 1 - 0.62 * ik) : hex; };
    drawTank(e.x, e.y, e.bodyAng, e.turretAng, e.r, {
      track: dim('#2b2f38'),
      body: flash > 0.4 ? '#ffffff' : dim(e.def.color),
      body2: flash > 0.4 ? '#ffd9d9' : dim('#6b7484'),
      turret: flash > 0.4 ? '#fff' : dim('#8d95a6'),
      barrel: flash > 0.4 ? '#fff' : dim('#5c6473'),
      outline: inked ? '#ded7ff' : ra.color,
      core: wa.color,
      barrelLen: e.r * (e.type === 'sniper' ? 2.2 : 1.7)
    });
    // 墨渍覆盖 + 银紫墨圈
    if (inked){
      ctx.save();
      ctx.globalAlpha = 0.16 + 0.2 * ik;
      ctx.fillStyle = '#0b0912';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.04, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.22 + 0.38 * ik;
      ctx.strokeStyle = '#ded7ff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 1.16 + Math.sin(state.time * 4 + e.id) * 1.6, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
    // 生物幼体：绿色虚线圈标识（不可再分裂）
    if (e.split){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#6fe02a';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.3, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    // 灼烧中的火焰覆盖（配色严格随来源元素）
    if (e.burn > 0){
      const ba = ATTRS[ATTR_INDEX[e.burnAttr] || 0];
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.28 + Math.sin(state.time * 22) * 0.1;
      ctx.fillStyle = ba.glow;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.1, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // 减速冰霜覆盖
    if (e.slow > 0){
      ctx.globalAlpha = 0.34;
      ctx.strokeStyle = '#b0f4ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.16, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 自由：激怒 —— 古铜色脉动外环，提示"它变快了"
    if (e.rage > 0){
      const k = clamp(e.rage / RAGE_DUR, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.3 * Math.abs(Math.sin(state.time * 9));
      ctx.strokeStyle = '#ff9a4d';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.24 + (1 - k) * 0.1), 0, TAU); ctx.stroke();
      ctx.restore();
    }
    // 司南：磁场 —— 红 N / 蓝 S 双环，外圈随剩余时间收缩
    if (e.magT > 0 && e.pole){
      const ma = ATTRS[ATTR_INDEX['magnet']] || ATTRS[0];
      const col = e.pole > 0 ? ma.color : (ma.color2 || ma.color);
      const k = clamp(e.magT / (ma.magDur || MAG_DUR), 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.3 + 0.25 * k;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.3 + 0.35 * k), 0, TAU); ctx.stroke();
      // 内圈反向脉动，像磁力线
      ctx.globalAlpha = 0.2 + 0.2 * Math.abs(Math.sin(state.time * 6));
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.95 + 0.25 * Math.abs(Math.sin(state.time * 6))), 0, TAU); ctx.stroke();
      ctx.restore();
      // 极性字母
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = col;
      ctx.font = 'bold ' + Math.round(e.r * 0.8) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e.pole > 0 ? 'N' : 'S', e.x, e.y + e.r * 1.75);
      ctx.restore();
    }
    // 赛博：动物形态 —— 覆盖在车体上的 emoji，底盘与炮管保留，战斗可读性不受影响
    if (e.animal){
      let sc = 1;
      if (e.morphT > 0){
        // 变形瞬间弹一下：0.55s 内从 0.4 倍弹到 1.25 倍再回落
        const t = 1 - e.morphT / 0.55;
        sc = 0.4 + 1.15 * Math.sin(t * Math.PI) + 0.25 * t;
      }
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = Math.round(e.r * 2.15 * sc) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(e.animal, e.x, e.y);
      ctx.restore();
    }
    // 文墨喊话：随机汉字（白色宋体，字号与坦克等大）
    if (e.shoutT > 0 && e.shoutChar){
      ctx.save();
      ctx.globalAlpha = clamp(e.shoutT / 0.6, 0, 1);
      ctx.font = Math.round(e.r * 2) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 7;
      ctx.fillText(e.shoutChar, e.x, e.y);
      ctx.restore();
    }
    // 血条
    if (e.hp < e.maxHp){
      const bw = e.r * 2.1, bh = 3.6;
      const bx = e.x - bw / 2, by = e.y - e.r - 12;
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = e.def.boss ? '#ff5c8a' : '#ff8a5c';
      ctx.fillRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), bh);
    }
    // 弱点 / 抗性标记：原生 emoji 显示（保留 emoji 自身彩色，不强制染色）
    //   头上：弱点 emoji + 元素主色 color 亮环（×1.65）
    //   脚下：抗性 emoji + 元素深色 dark 环（×0.5，颜色更深）
    //   中性深盘衬底提升对比度，元素色环让图标更醒目
    {
      const es = Math.round(clamp(e.r * 0.66, 13, 19));  // emoji 像素尺寸（随体型缩放；较旧版缩小 40%）
      const GAP = 2;                                      // emoji 横向间距
      const wn = e.weak   ? e.weak.length   : 0;
      const rn = e.resist ? e.resist.length : 0;
      if (wn > 0){
        const totalW = wn * es + (wn - 1) * GAP;
        const sx = e.x - totalW / 2;
        const cy = e.y - e.r - 18 - es;                  // 行中心 y（头顶上方）
        for (let i = 0; i < wn; i++){
          const at = ATTRS[ATTR_INDEX[e.weak[i]]] || ATTRS[0];
          const x = sx + i * (es + GAP);
          drawEmojiTag(at.ico, x, cy, es, at.color);
        }
      }
      if (rn > 0){
        const totalW = rn * es + (rn - 1) * GAP;
        const sx = e.x - totalW / 2;
        const cy = e.y + e.r + 12;                        // 行中心 y（脚底下方）
        for (let i = 0; i < rn; i++){
          const at = ATTRS[ATTR_INDEX[e.resist[i]]] || ATTRS[0];
          const x = sx + i * (es + GAP);
          drawEmojiTag(at.ico, x, cy, es, at.dark);
        }
      }
    }
  });
}

function drawPlayer(){
  if (!player) return;
  const a = curAttr();
  if (player.dead) return;
  // 无敌闪烁
  if (player.invuln > 0 && Math.floor(state.time * 24) % 2 === 0) return;
  drawTank(player.x, player.y, player.bodyAng, player.turretAng + 0, player.r, {
    track: '#232833',
    body: '#2f4a63',
    body2: '#4d7ea6',
    turret: '#5f93bd',
    barrel: '#7fb3d9',
    outline: a.color,
    core: a.color,
    barrelLen: player.r * 1.72 - player.recoil * 7
  });
  // 属性光环
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = a.color;
  ctx.globalAlpha = 0.34 + Math.sin(state.time * 3) * 0.1;
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 1.42, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = a.color;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 1.42, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBullets(){
  ctx.globalCompositeOperation = 'lighter';
  bullets.forEach(function(b){
    const a = ATTRS[b.attrIdx];
    // 拖尾
    const tl = b.trail;
    const len = Math.hypot(b.x - b.px, b.y - b.py);
    const tx = b.x - Math.cos(b.ang) * Math.max(tl, len * 3);
    const ty = b.y - Math.sin(b.ang) * Math.max(tl, len * 3);
    const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    // 司南：拖尾按磁极上色（红 = N，蓝 = S）
    g.addColorStop(1, a.id === 'magnet' && b.pole ? (b.pole > 0 ? a.color : (a.color2 || a.color)) : a.color);
    ctx.strokeStyle = g;
    ctx.lineWidth = b.r * 1.7;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    // 弹头（数学跳过 glowDot 白色圆，避免干扰字形；文墨为墨黑芯 + 银紫辉光）
    if (a.id !== 'math'){
      glowDot(ctx, b.x, b.y, b.r,
        a.id === 'magnet' && b.pole ? (b.pole > 0 ? a.color : (a.color2 || a.color)) : a.color,
        a.core || '#ffffff');
    }
    // 数学：弹丸正中显示大号清晰字形（无发光/无光晕/无底圆，纯文字）
    if (a.id === 'math'){
      ctx.save();
      ctx.fillStyle = '#ffffff';
      const fSize = Math.max(24, b.r * 5.5);
      ctx.font = 'bold ' + fSize.toFixed(0) + 'px "Cambria","Georgia","Times New Roman",serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // 黑色描边确保在任何背景上清晰可读
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.lineJoin = 'round';
      ctx.strokeText(b.glyph || '?', b.x, b.y);
      ctx.fillText(b.glyph || '?', b.x, b.y);
      ctx.restore();
    }
  });
  ebullets.forEach(function(b){
    const a = ATTRS[ATTR_INDEX[b.attr]] || ATTRS[0];
    ctx.strokeStyle = a.color;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = b.r * 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 1;
    glowDot(ctx, b.x, b.y, b.r, a.color, a.core || '#ffffff');
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';
}

function drawBeams(){
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  beams.forEach(function(bm){
    const a = ATTRS[bm.attrIdx];
    const t = bm.life / bm.max;
    const col = a.color;                                    // 直接用元素原色（参照老代码，避免多色轮替闪白）
    // 外辉光（元素原色，宽而淡）
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.34 * t;
    ctx.lineWidth = bm.w * 5;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    // 中层（主色层）
    ctx.globalAlpha = 0.6 * t;
    ctx.lineWidth = bm.w * 2.2;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    // 芯：文墨走墨黑，其余走白热细线（与老代码一致，颜色清晰可读）
    if (a.darkCore){
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = a.core || '#0a0a12';
      ctx.globalAlpha = 0.95 * t;
      ctx.lineWidth = bm.w * 0.9;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
    } else {
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.9 * t;
      ctx.lineWidth = bm.w * 0.75;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';
  ctx.lineCap = 'butt';
}

function drawParticles(){
  // 普通层：烟、血雾、碎片、色块、墨点（这几类必须走 source-over，否则墨/黑会被 lighter 吃掉）
  particles.forEach(function(p){
    const t = clamp(p.life / p.max, 0, 1);
    if (p.type === 'smoke' || p.type === 'mist'){
      ctx.globalAlpha = t * 0.5;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - t), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'shard'){
      ctx.globalAlpha = t;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.type === 'block'){
      // 彩色方块：必须走 source-over。lighter 模式下黑色会完全消失，
      // 而魔术的"红黑白"三色里黑色是主色之一。
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      const s = Math.max(0.5, p.size * (0.45 + t * 0.75));
      ctx.fillRect(-s / 2, -s / 2, s, s);
      if (p.rim){
        ctx.globalAlpha = t * 0.55;
        ctx.strokeStyle = p.rim;
        ctx.lineWidth = 1;
        ctx.strokeRect(-s / 2, -s / 2, s, s);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.type === 'ink'){
      // 墨点：暗色团块（徽墨紫心）+ 银紫描边，保留"黑"的实体感
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      const rr = p.size * (0.6 + t * 0.75);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(0.6, rr));
      g.addColorStop(0, 'rgba(88,76,124,' + (0.95 * t).toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(30,24,46,' + (0.95 * t).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(8,6,14,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.6, rr), 0, TAU); ctx.fill();
      ctx.strokeStyle = p.rim || '#ded7ff';
      ctx.globalAlpha = t * 0.85;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.4, rr * 0.8), 0, TAU); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
  // 发光层
  ctx.globalCompositeOperation = 'lighter';
  particles.forEach(function(p){
    if (p.type === 'smoke' || p.type === 'shard' || p.type === 'block') return;
    const t = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = t;
    switch (p.type){
      case 'spark':
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * t, 0, TAU); ctx.fill();
        break;
      case 'flame': {
        const sz = p.size * (0.5 + t * 0.9) * (1 + Math.sin((p.flick || 0) + state.time * 18) * 0.16);
        ctx.globalAlpha = t * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, TAU); ctx.fill();
        ctx.globalAlpha = t * 0.4;
        ctx.fillStyle = '#fff3c4';
        ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.5, 0, TAU); ctx.fill();
        break;
      }
      case 'ice':
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.6, 0);
        ctx.lineTo(0, p.size); ctx.lineTo(-p.size * 0.6, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      case 'prism':
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size * 1.3); ctx.lineTo(p.size * 0.75, 0);
        ctx.lineTo(0, p.size * 1.3); ctx.lineTo(-p.size * 0.75, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      case 'wind': {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * 0.5;
        ctx.lineCap = 'round';
        const ang = Math.atan2(p.vy, p.vx);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - Math.cos(ang) * p.size * 4, p.y - Math.sin(ang) * p.size * 4);
        ctx.stroke();
        break;
      }
      case 'void':
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * t, 0, TAU); ctx.fill();
        ctx.globalAlpha = t * 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * t * 2.2, 0, TAU); ctx.fill();
        break;
      case 'blood': {
        // 血滴：沿速度方向拉长的水滴 + 高光
        const ang = Math.atan2(p.vy, p.vx);
        const len = p.size * (1 + Math.min(2.4, Math.hypot(p.vx, p.vy) / 260)) * t;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(ang);
        ctx.globalAlpha = t;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, Math.max(0.5, len), Math.max(0.4, p.size * t * 0.7), 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = t * 0.45;
        ctx.fillStyle = '#ffa79c';
        ctx.beginPath(); ctx.ellipse(-len * 0.18, -p.size * t * 0.2, Math.max(0.3, len * 0.4), Math.max(0.2, p.size * t * 0.3), 0, 0, TAU); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = t;
        break;
      }
      case 'cell': {
        // 细胞囊：半透明外膜 + 亮核，微微搏动
        const wob = 1 + Math.sin((p.seed || 0) + state.time * 9) * 0.15;
        const rr = Math.max(0.5, p.size * t * wob);
        const sp = puffSprite(p.color);
        if (sp){ ctx.globalAlpha = t * 0.45; ctx.drawImage(sp, p.x - rr * 1.8, p.y - rr * 1.8, rr * 3.6, rr * 3.6); }
        ctx.globalAlpha = t * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.fill();
        ctx.globalAlpha = t;
        ctx.fillStyle = '#eaffd0';
        ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.34, 0, TAU); ctx.fill();
        break;
      }
      case 'cloud': {
        // 云絮：柔光团，缓慢膨胀
        const rr = Math.max(0.6, p.size * (1.45 - t * 0.55));
        const sp = puffSprite(p.color);
        if (sp){ ctx.globalAlpha = t * 0.4; ctx.drawImage(sp, p.x - rr, p.y - rr, rr * 2, rr * 2); }
        break;
      }
      case 'star': {
        // 四芒星：8 顶点交替内外半径
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.globalAlpha = t;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        const R = Math.max(0.5, p.size * t), r2 = R * 0.26;
        for (let i = 0; i < 8; i++){
          const a = i / 8 * TAU;
          const rr = (i % 2 === 0) ? R : r2;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = t;
        break;
      }
      case 'digit': {
        // 八段码数字（数学元素专用）
        drawSeg7(ctx, p.x, p.y, Math.max(2, p.size * (0.5 + t * 0.6)), p.dig | 0, p.color, t);
        ctx.globalAlpha = t;
        break;
      }
      case 'glyph': {
        // 赛博乱码字符
        ctx.save();
        ctx.globalAlpha = t;
        ctx.fillStyle = p.color;
        ctx.font = 'bold ' + Math.max(5, p.size * (0.7 + t * 0.7)).toFixed(1) + 'px "Consolas","Courier New",monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.ch || '#', p.x, p.y);
        ctx.restore();
        ctx.globalAlpha = t;
        break;
      }
    }
    ctx.globalAlpha = 1;
  });
  ctx.globalCompositeOperation = 'source-over';
}

/**
 * 画一个七段数码管数字
 * 段位定义：a 上 / b 右上 / c 右下 / d 下 / e 左下 / f 左上 / g 中
 */
function drawSeg7(c, cx, cy, h, num, color, alpha){
  const mask = SEG7[((num % 10) + 10) % 10] || 0;
  const w = h * 0.5;                 // 数码管整体宽度
  const th = Math.max(1, h * 0.17);  // 段条厚度
  const g = h * 0.5 - th;            // 段中心到中线的距离
  c.save();
  c.translate(cx, cy);
  c.fillStyle = color;
  c.globalAlpha = alpha;
  const bar = function(horiz, ox, oy){
    c.save();
    c.translate(ox, oy);
    if (!horiz) c.rotate(Math.PI / 2);
    c.fillRect(-w / 2 + th / 2, -th / 2, w - th, th);
    c.restore();
  };
  if (mask & 0x01) bar(true,  0, -g);        // a
  if (mask & 0x02) bar(false, w / 2 - th / 2, -g / 2 - th); // b
  if (mask & 0x04) bar(false, w / 2 - th / 2,  g / 2 + th); // c
  if (mask & 0x08) bar(true,  0,  g);        // d
  if (mask & 0x10) bar(false, -w / 2 + th / 2, g / 2 + th); // e
  if (mask & 0x20) bar(false, -w / 2 + th / 2, -g / 2 - th); // f
  if (mask & 0x40) bar(true,  0,  0);        // g
  c.restore();
  c.globalAlpha = 1;
}

function drawRings(){
  ctx.globalCompositeOperation = 'lighter';
  rings.forEach(function(r){
    const t = clamp(r.life / r.max_life, 0, 1);
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = t * 0.85;
    ctx.lineWidth = r.w * t;
    ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(0.5, r.r), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  });
  ctx.globalCompositeOperation = 'source-over';
}

function drawArcs(){
  ctx.globalCompositeOperation = 'lighter';
  arcs.forEach(function(a){
    const t = clamp(a.life / a.max, 0, 1);
    ctx.strokeStyle = a.color;
    ctx.globalAlpha = t;
    ctx.lineWidth = a.w;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x1, a.y1);
    for (let i = 1; i < a.seg; i++){
      const k = i / a.seg;
      const jitter = (1 - t) * 0 + (Math.random() - 0.5) * 15;
      ctx.lineTo(lerp(a.x1, a.x2, k) + jitter, lerp(a.y1, a.y2, k) + jitter);
    }
    ctx.lineTo(a.x2, a.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  texts.forEach(function(t){
    const k = clamp(t.life / t.max, 0, 1);
    const pop = t.max - t.life < 0.12 ? 1 + (1 - (t.max - t.life) / 0.12) * 0.5 : 1;
    ctx.globalAlpha = k > 0.7 ? 1 : k / 0.7;
    const fam = t.font || '"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.font = (t.bold ? 'bold ' : '') + (t.size * pop).toFixed(1) + 'px ' + fam;
    if (t.outline){
      ctx.lineWidth = 3.4;
      ctx.strokeStyle = 'rgba(0,0,0,.72)';
      ctx.lineJoin = 'round';
      ctx.strokeText(t.str, t.x, t.y);
    }
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
    ctx.globalAlpha = 1;
  });
  ctx.textBaseline = 'alphabetic';
}

function drawMinimap(){
  const mw = 156, mh = Math.round(mw * MAP_H / MAP_W);
  const px = VW - mw - 16, py = 96;
  ctx.save();
  ctx.globalAlpha = 0.86;
  ctx.fillStyle = 'rgba(10,12,18,.86)';
  rrect(ctx, px - 4, py - 4, mw + 8, mh + 8, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
  const sx = mw / WORLD_W, sy = mh / WORLD_H;
  if (minimapCv){
    ctx.drawImage(minimapCv, px, py, mw, mh);
  }
  // 敌人
  enemies.forEach(function(e){
    ctx.fillStyle = e.def.boss ? '#ff5c8a' : '#ff8a5c';
    ctx.beginPath();
    ctx.arc(px + e.x * sx, py + e.y * sy, e.def.boss ? 3.4 : 2, 0, TAU);
    ctx.fill();
  });
  // 玩家
  if (player && !player.dead){
    const a = curAttr();
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.arc(px + player.x * sx, py + player.y * sy, 3.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + player.x * sx, py + player.y * sy);
    ctx.lineTo(px + player.x * sx + Math.cos(player.turretAng) * 7, py + player.y * sy + Math.sin(player.turretAng) * 7);
    ctx.stroke();
  }
  ctx.restore();
}

function buildMinimap(){
  try {
    minimapCv = document.createElement('canvas');
    minimapCv.width = MAP_W * 2;
    minimapCv.height = MAP_H * 2;
    const c = minimapCv.getContext('2d');
    if (!c) return;
    c.clearRect(0, 0, minimapCv.width, minimapCv.height);
    for (let y = 0; y < MAP_H; y++){
      for (let x = 0; x < MAP_W; x++){
        const t = grid[y][x];
        if (!t) continue;
        c.fillStyle = t === 2 ? 'rgba(150,162,184,.55)' : 'rgba(168,90,52,.6)';
        c.fillRect(x * 2, y * 2, 2, 2);
      }
    }
  } catch (e) { minimapCv = null; }
}

function drawCrosshair(){
  const a = curAttr();
  const x = mouse.x, y = mouse.y;
  const recoil = player ? player.recoil : 0;
  const gap = 7 + recoil * 5;
  ctx.save();
  ctx.translate(x, y);
  // 外环
  ctx.strokeStyle = a.color;
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 12 + recoil * 6, 0, TAU); ctx.stroke();
  // 旋转刻度
  ctx.rotate(state.time * 0.7);
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++){
    ctx.rotate(TAU / 4);
    ctx.beginPath();
    ctx.moveTo(0, -(16 + recoil * 4));
    ctx.lineTo(0, -(20 + recoil * 4));
    ctx.stroke();
  }
  ctx.rotate(-state.time * 0.7);
  // 十字
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-gap - 5, 0); ctx.lineTo(-gap, 0);
  ctx.moveTo(gap, 0); ctx.lineTo(gap + 5, 0);
  ctx.moveTo(0, -gap - 5); ctx.lineTo(0, -gap);
  ctx.moveTo(0, gap); ctx.lineTo(0, gap + 5);
  ctx.stroke();
  // 中心点
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ============================================================
   每帧推进
   ============================================================ */
function step(dt){
  state.time += dt;
  state.shake = Math.max(0, state.shake - dt * 28);

  mouse.wx = mouse.x + cam.x;
  mouse.wy = mouse.y + cam.y;

  // 流场每 0.22s 重算一次（敌人导航）
  flowTimer -= dt;
  if (flowTimer <= 0){ flowTimer = 0.22; computeFlowField(); }

  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateBats(dt);
  updateShocks(dt);
  updateZones(dt);
  updateParticles(dt);
  updateRainbow();

  // --- 波次调度（测试工坊不刷波）---
  if (!state.workshop){
    if (state.waveActive){
      if (state.plan && state.plan.length){
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0){
          state.spawnTimer = rand(0.32, 1.05);
          spawnEnemy(state.plan.shift(), state.wave);
          state.pendingSpawn = state.plan.length;
        }
      } else if (enemies.length === 0){
        state.waveActive = false;
        state.waveTimer = 3;
        waveMsg('WAVE CLEAR  +' + (state.wave * 50), 2.2);
        state.score += state.wave * 50;
        // 清波修复：回复 30% 最大生命，鼓励主动清场
        if (!player.dead && player.hp < player.maxHp){
          const heal = Math.min(player.maxHp - player.hp, player.maxHp * 0.3);
          player.hp += heal;
          addText(player.x, player.y - 44, '+' + Math.round(heal) + ' 装甲修复', '#34d399',
            { size: 18, bold: true, life: 1.4, vy: -34 });
          rings.push({ x: player.x, y: player.y, r: player.r * 2, max: player.r * 0.8,
            life: 0.5, max_life: 0.5, color: '#34d399', w: 3, inwards: true });
        }
        updateHUD();
      }
    } else {
      state.waveTimer -= dt;
      if (state.waveTimer <= 0) startWave(state.wave + 1);
    }
  }

  updateCam();
  updateWaveHUD();
  updateBossBar();
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  drawGround();

  const sh = state.shake;
  const sx = sh ? rand(-sh, sh) : 0;
  const sy = sh ? rand(-sh, sh) : 0;

  ctx.save();
  ctx.translate(-cam.x + sx, -cam.y + sy);
  drawZones();
  drawWalls();
  drawEnemies();
  drawPlayer();
  drawBullets();
  drawBeams();
  drawShocks();
  drawBats();
  drawParticles();
  drawRings();
  drawArcs();
  drawTexts();
  ctx.restore();

  drawMinimap();
  if (state.mode === 'play') drawCrosshair();

  // 测试工坊操作提示
  if (state.workshop){
    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = '#9fb0c8';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(
      '测试工坊 · ESC 配置 · R 重置' +
      (state.wsEdit ? ' · 编辑中：左键放墙/拖敌人 · 右键删墙' : ' · 暂停后可「编辑场景」'),
      VW / 2, VH - 14);
    ctx.restore();
  }
}

/* ============================================================
   HUD
   ============================================================ */
const el = {};
function grabEls(){
  ['hpfill','hptxt','scoreTxt','waveTxt','waveLeftTxt','waveMsg','ammoTrack','attrTrack',
   'bossbar','bossfill','bossName','overlay','ovbox','vignette',
   'xpfill','lvlTxt','xpTxt'].forEach(function(id){
    el[id] = document.getElementById(id);
  });
}
function buildHUD(){
  if (!el.ammoTrack) return;
  el.ammoTrack.innerHTML = '';
  AMMO.forEach(function(a, i){
    const d = document.createElement('div');
    d.className = 'item ammo';
    d.dataset.idx = i;
    d.innerHTML = '<span class="ico">' + a.ico + '</span>' + a.name;
    el.ammoTrack.appendChild(d);
  });
  el.attrTrack.innerHTML = '';
  ATTRS.forEach(function(a, i){
    const d = document.createElement('div');
    d.className = 'item attr';
    d.dataset.idx = i;
    d.innerHTML = '<span class="ico">' + a.ico + '</span>' + a.name;
    el.attrTrack.appendChild(d);
  });
  syncHUD();
}
function syncHUD(){
  if (!player) return;
  const ammo = curAmmo(), attr = curAttr();
  // 弹药高亮
  Array.prototype.forEach.call(el.ammoTrack.children, function(c, i){
    c.classList.toggle('on', i === player.ammoIdx);
  });
  // 属性高亮 + 主题色
  Array.prototype.forEach.call(el.attrTrack.children, function(c, i){
    c.classList.toggle('on', i === player.attrIdx);
    if (i === player.attrIdx){
      c.style.background = 'linear-gradient(135deg,' + attr.color + ',' + attr.glow + ')';
    } else {
      c.style.background = '';
    }
  });
  try { document.documentElement.style.setProperty('--ac', attr.color); } catch (e) {}
}
function updateHUD(){
  if (!player) return;
  if (state.workshop){           // 测试工坊：双方无限血量
    el.hpfill.style.width = '100%';
    el.hpfill.classList.remove('low');
    el.hptxt.textContent = '∞';
    el.scoreTxt.textContent = fmt(state.score);
    el.vignette.style.opacity = '0';
    updateLevelHUD();
    return;
  }
  const pct = clamp(player.hp / player.maxHp, 0, 1) * 100;
  el.hpfill.style.width = pct + '%';
  el.hpfill.classList.toggle('low', pct <= 34);
  el.hptxt.textContent = Math.ceil(player.hp) + ' / ' + Math.round(player.maxHp);
  el.scoreTxt.textContent = fmt(state.score);
  el.vignette.style.opacity = pct <= 34 ? String((1 - pct / 34) * 0.85) : '0';
  updateLevelHUD();
}
function updateLevelHUD(){
  if (!player || !el.xpfill) return;
  const pct = clamp(player.xp / player.xpNext, 0, 1) * 100;
  el.xpfill.style.width = pct.toFixed(1) + '%';
  const l = String(player.level);
  if (el.lvlTxt.textContent !== l){
    el.lvlTxt.textContent = l;
    // 重播一次弹出动画
    const tag = el.lvlTxt.parentNode;
    if (tag && tag.classList){
      tag.classList.remove('up');
      void tag.offsetWidth;
      tag.classList.add('up');
    }
  }
  el.xpTxt.textContent = Math.floor(player.xp) + ' / ' + player.xpNext;
}
let _lastLeft = '', _lastBossW = -1;
function updateWaveHUD(){
  // 每帧都写 DOM 不划算，只在内容变化时更新
  const w = String(state.wave);
  if (el.waveTxt.textContent !== w) el.waveTxt.textContent = w;
  const left = enemies.length + (state.plan ? state.plan.length : 0);
  const s = state.waveActive ? ('剩余 ' + left) : ('下一波 ' + Math.max(0, Math.ceil(state.waveTimer)) + 's');
  if (s !== _lastLeft){ _lastLeft = s; el.waveLeftTxt.textContent = s; }
}
function updateBossBar(){
  const live = !!(boss && !boss.dead);
  el.bossbar.classList.toggle('on', live);
  if (!live) return;
  if (el.bossName.textContent !== boss.def.name) el.bossName.textContent = boss.def.name;
  const pctf = clamp(boss.hp / boss.maxHp, 0, 1) * 100;
  if (Math.abs(pctf - _lastBossW) > 0.15){
    _lastBossW = pctf;
    el.bossfill.style.width = pctf.toFixed(1) + '%';
  }
}

/* ============================================================
   切换弹药 / 属性
   ============================================================ */
function switchAmmo(dir){
  if (!player) return;
  player.ammoIdx = (player.ammoIdx + dir + AMMO.length) % AMMO.length;
  player.cd = Math.max(player.cd, 0.08);
  SFX.sw();
  syncHUD();
  const a = curAmmo();
  waveMsg(a.name + ' · ' + a.desc, 1.1);
}
function switchAttr(dir){
  if (!player) return;
  player.attrIdx = (player.attrIdx + dir + ATTRS.length) % ATTRS.length;
  const a = curAttr();
  SFX.swAttr(player.attrIdx);
  syncHUD();
  // 展示「综合倍率」而不是裸 mul：地球的裸 mul 1.83 最高，但单发伤害 ×0.4，
  // 只看 mul 会把它误判成最强元素。综合倍率才是真实的 DPS 水平。
  waveMsg(a.name + ' 综合×' + attrDpsMul(a).toFixed(2) + ' · ' + (a.desc || a.en), 1.5);
  // 切换时的环形反馈
  rings.push({ x: player.x, y: player.y, r: player.r * 1.2, max: player.r * 3.4, life: 0.36, max_life: 0.36, color: a.color, w: 3 });
  for (let i = 0; i < 16; i++){
    const ang = (i / 16) * TAU;
    pushParticle({
      x: player.x + Math.cos(ang) * player.r * 1.4,
      y: player.y + Math.sin(ang) * player.r * 1.4,
      vx: Math.cos(ang) * 90, vy: Math.sin(ang) * 90,
      life: rand(0.25, 0.5), max: 0.5, size: rand(2, 4),
      color: a.color, type: 'spark', drag: 3
    });
  }
}

/* ============================================================
   流程控制
   ============================================================ */
function resetWorld(){
  state.workshop = false; state.wsEdit = false; wsEnemy = null; wsCfg = null;
  enemies.length = 0; bullets.length = 0; ebullets.length = 0;
  particles.length = 0; texts.length = 0; beams.length = 0;
  zones.length = 0; arcs.length = 0; rings.length = 0; pickups.length = 0;
  boss = null; uid = 1;
  _lastBossW = -1; _lastLeft = '';
  state.score = 0;
  state.wave = 0;
  state.killsByAttr = {};
  state.waveTimer = 1.2;
  state.waveActive = false;
  state.plan = [];
  state.time = 0;
  state.shake = 0;
  genMap();
  rebuildWallIndex();
  buildMinimap();
  player = makePlayer();
  computeFlowField();
  updateCam();
  updateHUD();
  syncHUD();
}
function startGame(){
  SFX.init();
  SFX.resume();
  resetWorld();
  state.mode = 'play';
  el.overlay.classList.add('hide');
  startWave(1);
}
function gameOver(){
  state.mode = 'over';
  SFX.over();
  try {
    const b = parseInt(localStorage.getItem('rb_best') || '0', 10) || 0;
    if (state.score > b){
      localStorage.setItem('rb_best', String(state.score));
      state.best = state.score;
    } else state.best = b;
  } catch (e) { state.best = Math.max(state.best, state.score); }
  showOverlay('over');
}
function togglePause(){
  if (state.workshop){
    if (state.mode === 'play'){ state.mode = 'pause'; showWorkshopPanel(); }
    else if (state.mode === 'pause'){ state.mode = 'play'; state.wsEdit = false; el.overlay.classList.add('hide'); }
    return;
  }
  if (state.mode === 'play'){
    state.mode = 'pause';
    showOverlay('pause');
  } else if (state.mode === 'pause'){
    state.mode = 'play';
    el.overlay.classList.add('hide');
  }
}
