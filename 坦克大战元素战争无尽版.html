<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>共鸣爆破 · 坦克大战</title>
<style>
  :root{
    --bg:#07080c;
    --panel:rgba(16,18,26,.82);
    --line:rgba(255,255,255,.09);
    --text:#e9ecf5;
    --muted:#79808f;
    --ac:#ffd966;                 /* 当前属性色，由 JS 动态改写 */
    --ac2:#fff3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{position:fixed;inset:0;}
  #game{display:block;width:100%;height:100%;cursor:none;}

  /* ---------- 低血量渐晕 ---------- */
  #vignette{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(190,20,40,.55) 100%);
    transition:opacity .25s;
  }

  /* ---------- HUD ---------- */
  .hud{position:absolute;pointer-events:none;font-size:13px;}
  #hudTL{top:16px;left:16px;}
  #hudTC{top:16px;left:50%;transform:translateX(-50%);text-align:center;}
  #hudTR{top:16px;right:16px;text-align:right;color:var(--muted);line-height:1.7;font-size:12px;}

  .hpwrap{
    width:260px;height:16px;border-radius:9px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
    overflow:hidden;position:relative;
  }
  #hpfill{
    height:100%;width:100%;border-radius:9px;
    background:linear-gradient(90deg,#34d399,#a7f3d0);
    transition:width .18s ease-out;
  }
  #hpfill.low{background:linear-gradient(90deg,#ef4444,#fb923c);}
  .hprow{display:flex;align-items:center;gap:10px;}
  .hptxt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;}

  /* ---------- 经验条 / 等级 ---------- */
  .xpwrap{
    width:260px;height:5px;margin-top:6px;border-radius:4px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);overflow:hidden;position:relative;
  }
  #xpfill{
    height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#6f7ff0,#b7c4ff);
    box-shadow:0 0 10px rgba(140,155,255,.55);
    transition:width .25s ease-out;
  }
  .lvltag{margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:1px;}
  .lvltag b{color:#cdd6ff;font-size:13.5px;font-variant-numeric:tabular-nums;}
  .lvltag span{margin-left:6px;font-variant-numeric:tabular-nums;}
  .lvltag.up{animation:lvpop .5s ease-out;}
  @keyframes lvpop{
    0%{transform:scale(1);}
    30%{transform:scale(1.22);color:#fff;}
    100%{transform:scale(1);}
  }
  .score{margin-top:9px;font-size:13px;color:var(--muted);letter-spacing:.5px;}
  .score b{color:#fff;font-size:19px;font-variant-numeric:tabular-nums;}

  .wavetag{
    display:inline-block;padding:5px 16px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);
    font-size:12.5px;letter-spacing:2px;color:var(--muted);
  }
  .wavetag b{color:#fff;font-size:15px;letter-spacing:0;}
  #waveMsg{
    margin-top:8px;font-size:13px;color:var(--ac);letter-spacing:3px;
    opacity:0;transition:opacity .3s;text-shadow:0 0 14px var(--ac);
  }
  #waveMsg.show{opacity:1;}

  /* ---------- Boss 血条 ---------- */
  #bossbar{
    position:absolute;top:56px;left:50%;transform:translateX(-50%);
    width:min(560px,70vw);display:none;
  }
  #bossbar.on{display:block;}
  #bossbar .bn{
    font-size:11.5px;letter-spacing:3px;color:#ff8fa3;margin-bottom:5px;text-align:center;
  }
  #bossbar .bw{
    height:9px;border-radius:6px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,90,120,.35);overflow:hidden;
  }
  #bossfill{
    height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#be123c,#ff5c8a,#ffb3c7);
    transition:width .2s;
  }

  /* ---------- 底部选择器 ---------- */
  #hudBC{
    bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .selrow{display:flex;align-items:center;gap:8px;}
  .sellabel{
    font-size:10.5px;letter-spacing:2px;color:#5c6373;
    width:34px;text-align:right;flex-shrink:0;
  }
  .track{
    display:flex;gap:5px;padding:5px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(8px);
    max-width:min(94vw,1180px);flex-wrap:wrap;justify-content:center;
  }
  .item{
    position:relative;padding:6px 13px;border-radius:8px;
    font-size:12.5px;color:#6d7484;white-space:nowrap;
    transition:color .16s,background .16s,transform .16s;
  }
  .item .ico{margin-right:5px;font-size:13px;}
  /* 属性增至 11 种后，窄屏逐级瘦身，避免挤出视口 */
  @media (max-width:1240px){
    .item{padding:5px 9px;font-size:11.5px;}
    .item .ico{margin-right:3px;font-size:12px;}
  }
  @media (max-width:900px){
    .item{padding:4px 7px;font-size:10.5px;}
    .item .ico{margin-right:2px;font-size:11px;}
    .sellabel{width:28px;font-size:10px;}
  }
  /* 属性轨道增至 20 项后单独瘦身（弹药只有 6 项，保持宽松）。
     用 #attrTrack 提高特异性，才能压过上面的 .item 媒体查询。 */
  #attrTrack .item{padding:4px 8px;font-size:11.5px;}
  #attrTrack .item .ico{margin-right:3px;font-size:12px;}
  @media (max-width:1500px){
    #attrTrack .item{padding:3px 6px;font-size:11px;}
    #attrTrack .item .ico{margin-right:2px;font-size:11px;}
  }
  @media (max-width:1100px){
    #attrTrack .item{padding:2px 4px;font-size:10px;}
    #attrTrack .item .ico{margin-right:1px;font-size:10px;}
    .sellabel{width:26px;font-size:9px;letter-spacing:1px;}
  }
  .item .sub{font-size:9.5px;opacity:.6;margin-left:5px;letter-spacing:1px;}
  .item.on{color:#0a0b0f;transform:translateY(-2px);font-weight:600;}
  .item.on.ammo{background:linear-gradient(135deg,#dfe6f5,#aab6cc);box-shadow:0 4px 16px rgba(200,215,255,.28);}
  .item.on.attr{box-shadow:0 4px 18px var(--ac);}

  /* ---------- 覆盖层 ---------- */
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,6,10,.9);backdrop-filter:blur(7px);
    text-align:center;cursor:pointer;z-index:20;
  }
  #overlay.hide{display:none;}
  .ovbox{max-width:640px;padding:34px 44px;}
  .ovtitle{
    font-size:38px;font-weight:800;letter-spacing:6px;margin-bottom:6px;
    background:linear-gradient(100deg,#fff 10%,var(--ac) 55%,#8ab4ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .ovsub{font-size:12.5px;letter-spacing:5px;color:#5c6373;margin-bottom:26px;}
  .ovkeys{
    display:grid;grid-template-columns:auto 1fr;gap:7px 16px;
    font-size:13px;text-align:left;margin:0 auto 26px;width:fit-content;color:#a8b0c0;
  }
  .ovkeys kbd{
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;padding:2px 9px;
    font-family:inherit;font-size:11.5px;color:#fff;text-align:center;
  }
  .ovbtn{
    display:inline-block;padding:12px 34px;border-radius:11px;
    font-size:15px;font-weight:600;letter-spacing:3px;color:#0a0b0f;
    background:linear-gradient(135deg,var(--ac),#fff);
    box-shadow:0 8px 28px rgba(255,217,102,.28);
  }
  .ovstats{
    margin-top:20px;font-size:13px;color:var(--muted);line-height:1.9;
  }
  .ovstats b{color:#fff;font-size:17px;}
  .hint{margin-top:14px;font-size:11.5px;color:#4d5462;letter-spacing:1px;}
  .bigscore{
    font-size:54px;font-weight:800;letter-spacing:2px;margin:6px 0 2px;color:#fff;
    text-shadow:0 4px 24px rgba(255,217,102,.35);font-variant-numeric:tabular-nums;
  }
  .ovsection{
    margin:18px auto 8px;font-size:12px;letter-spacing:3px;color:#5c6373;text-align:left;
    width:fit-content;
  }
  .ovbtns{margin-top:18px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .ovbtn.export-btn{
    background:linear-gradient(135deg,#7a5cff,#c08bff);
    box-shadow:0 8px 28px rgba(140,110,255,.32);margin-top:0;cursor:pointer;
  }

  /* ---------- 元素图例 ---------- */
  /* 元素增至 20 种：默认两列（栏宽极大放宽，杜绝重叠/换行）；窄屏降为一列 */
  .elemgrid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px 56px;font-size:12.5px;color:#7f8797;
    text-align:left;margin:0 auto 22px;width:fit-content;max-width:1180px;
  }
  .elemgrid .row{display:flex;align-items:center;gap:9px;line-height:1.6;white-space:nowrap;min-width:0;}
  .elemgrid .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .elemgrid .nm{color:#dfe4ef;min-width:36px;flex-shrink:0;}
  .elemgrid .mul{color:#5f6674;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;}
  @media (max-width:760px){ .elemgrid{grid-template-columns:1fr;gap:7px 24px;} }

  /* ---------- 测试工坊配置面板 ---------- */
  .wspanel{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px;}
  .wscol{flex:1;min-width:320px;text-align:left;}
  .wshead,.wsrow{display:flex;align-items:center;gap:8px;font-size:12px;}
  .wshead{padding:4px 0;color:#7f8797;border-bottom:1px solid var(--line);}
  .wsrow{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .wsico{width:22px;text-align:center;font-size:15px;}
  .wsnm{width:50px;color:#dfe4ef;flex-shrink:0;}
  .wsrow label{display:flex;align-items:center;gap:3px;color:#9fb0c8;font-size:11px;cursor:pointer;white-space:nowrap;}
  .wsnum{width:54px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:5px;padding:1px 4px;font-size:11px;}
  .wssrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px;}
  .wslbl{color:#cdd6e6;min-width:96px;}
  .wssrow input[type=range]{flex:1;accent-color:var(--ac);}
  .wslab{color:#fff;min-width:42px;text-align:right;font-variant-numeric:tabular-nums;}
  .wsbtns{margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .wsbtn2{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:2px;cursor:pointer;color:#0a0b0f;background:linear-gradient(135deg,var(--ac),#fff);user-select:none;}
  .wsbtn2.sec{background:linear-gradient(135deg,#3aa0ff,#7ee0ff);}
  .wsbtn2.warn{background:linear-gradient(135deg,#ff7a8a,#ffb0c0);}
  .wsbtn2.menu{background:linear-gradient(135deg,#9b8cff,#c9b8ff);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="vignette"></div>

  <div class="hud" id="hudTL">
    <div class="hprow">
      <div class="hpwrap"><div id="hpfill"></div></div>
      <div class="hptxt" id="hptxt">100 / 100</div>
    </div>
    <div class="xpwrap"><div id="xpfill"></div></div>
    <div class="lvltag">LV <b id="lvlTxt">1</b> <span id="xpTxt">0 / 40</span></div>
    <div class="score">得分 <b id="scoreTxt">0</b></div>
  </div>

  <div class="hud" id="hudTC">
    <div class="wavetag">WAVE <b id="waveTxt">1</b> <span id="waveLeftTxt"></span></div>
    <div id="waveMsg"></div>
  </div>

  <div class="hud" id="hudTR">
    <div>WASD 移动 · 左键射击</div>
    <div>Q / E 切换弹药 · 滚轮切换属性</div>
    <div>P 暂停 · R 重开</div>
  </div>

  <div id="bossbar">
    <div class="bn" id="bossName">BOSS</div>
    <div class="bw"><div id="bossfill"></div></div>
  </div>

  <div class="hud" id="hudBC">
    <div class="selrow">
      <div class="sellabel">弹药</div>
      <div class="track" id="ammoTrack"></div>
    </div>
    <div class="selrow">
      <div class="sellabel">属性</div>
      <div class="track" id="attrTrack"></div>
    </div>
  </div>

  <div id="overlay">
    <div class="ovbox" id="ovbox"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   共鸣爆破 · 坦克大战   —— 纯单机 / 无依赖 / 单文件
   ============================================================ */

/* ---------------- 共鸣属性 ----------------
   color : 元素主色（飘字 / 拖尾 / 光环 / UI 强调，暗背景下必须可读）
   glow  : 高光色（描边、环、星芒）
   deep  : 本体暗色（墨黑专用，用于粒子填充，不走 lighter）
   core  : 弹头/光束芯色，多数为白；文墨为墨黑（darkCore）
   mul   : 元素伤害倍率（基础值）。取值 = 1.28 / 特性折算系数，
           使全部元素的「基础倍率 × 特性收益」对齐到同一水平线 ≈1.28。
           特性越弱或越依赖条件，基础倍率越高；无特性元素拿满 1.28。
           由此「无特性」（血染/天空，×1.28）与「有特性」（其余，
           基础 0.93~1.19 但叠加特性后≈1.28）在实战中完全平衡——
           无特性 = 纯粹倍率补偿；有特性 = 倍率略低但换取机制收益。
   ico   : 使用 emoji 图标（按需求指定），仅出现在 HTML 选择器与图例，
           不进入 canvas 绘制，故不影响粒子/画风一致性。
------------------------------------------- */
const ATTRS = [
  { id:'physical', name:'物理', en:'PHYSICAL', ico:'⚙️', color:'#e8e4d9', glow:'#fffaf0', dark:'#8a8677',
    core:'#ffffff', mul:1.07, desc:'暴击率 +25%' },                        // 特性系数 ×1.20
  { id:'fusion',   name:'热熔', en:'FUSION',   ico:'🔥', color:'#ff6b3d', glow:'#ffb066', dark:'#8c2f14',
    core:'#ffffff', mul:0.93, desc:'附加持续灼烧' },                        // ×1.38
  { id:'glacio',   name:'冷凝', en:'GLACIO',   ico:'❄️', color:'#4fd8e8', glow:'#b0f4ff', dark:'#14606e',
    core:'#ffffff', mul:1.16, desc:'大幅减速' },                            // ×1.10
  { id:'electro',  name:'导电', en:'ELECTRO',  ico:'⚡️', color:'#b46fe8', glow:'#e8c4ff', dark:'#5b2b80',
    core:'#ffffff', mul:0.96, desc:'连锁 2 个目标' },                       // ×1.34
  { id:'aero',     name:'气动', en:'AERO',     ico:'☁️', color:'#5fe8a0', glow:'#c0ffdf', dark:'#1c6b48',
    core:'#ffffff', mul:1.19, desc:'强力击退' },                            // ×1.08
  { id:'spectro',  name:'衍射', en:'SPECTRO',  ico:'☀️', color:'#ffd966', glow:'#fff3c4', dark:'#8a6a12',
    core:'#ffffff', mul:1.05, desc:'命中点光环溅射' },                      // ×1.22
  { id:'havoc',    name:'湮灭', en:'HAVOC',    ico:'🌑', color:'#ff5c8a', glow:'#ffb0c8', dark:'#8c1f43',
    core:'#ffffff', mul:0.88, desc:'命中易伤+20%·其余元素增伤5秒' },           // ×1.04

  { id:'ink',      name:'文墨', en:'INK',      ico:'✒️', color:'#9c93c4', glow:'#ded7ff', dark:'#2a2440',
    deep:'#0b0912', core:'#0c0a12', darkCore:true, mul:1.12, desc:'墨染：目标变暗 · 攻击欲望骤降' }, // ×1.14
  { id:'blood',    name:'血染', en:'CRIMSON',  ico:'🩸', color:'#ff2d2d', glow:'#ff8f86', dark:'#7a0f10',
    core:'#ffffff', mul:0.66, desc:'直接伤害×0.6 · 永不暴击 · 20%召唤吸血蝙蝠8秒' }, // ×1.10 的 60%
  { id:'bio',      name:'生物', en:'BIO',      ico:'🍀', color:'#6fe02a', glow:'#c8ff8a', dark:'#2c6b10',
    core:'#ffffff', mul:1.16, desc:'10% 概率分裂 · 幼体攻击力减半' },       // ×1.10
  { id:'sky',      name:'天空', en:'SKY',      ico:'🔵', color:'#3d7bff', glow:'#bcd8ff', dark:'#12306e',
    core:'#ffffff', mul:0.75, desc:'倍率×0.75 · 10% 自身移速/攻速+100% 持续3秒' },   // 倍率变为原来的 75%

  { id:'rainbow',  name:'彩虹', en:'RAINBOW',  ico:'🌈', rainbow:true, color:'#ff5bd8', glow:'#b6f0ff', dark:'#7a2a6b',
    core:'#ffffff', mul:1.10, desc:'5% 概率回血 · 回复量∝伤害' },           // ×1.16

  /* ---------------- 第二批元素（8 种） ----------------
     这几个带 rateMul / dmgBoost / sizeMul / randLo / randHi，
     不能只看 mul 判断强弱，要看「综合倍率」：
         综合 = mul × dmgBoost × rateMul × 特性收益 ≈ 1.28
     例：地球 mul 1.83 看着最高，但伤害 ×0.4，单发其实很低，
         靠 ×1.75 攻速把 DPS 拉回 1.28 —— 手感是"刮得快"。
  ---------------------------------------------------- */
  { id:'magic',    name:'魔术', en:'MAGIC',    ico:'🎲', color:'#e8342e', color2:'#161018', glow:'#ffffff', dark:'#3a0a12',
    core:'#ffffff', mul:1.28, randLo:1, randHi:6,
    desc:'伤害倍率 1~6 纯随机 · 均值 1.28' },                                // 归一化后均值 ×1.00
  { id:'earth',    name:'地球', en:'EARTH',    ico:'🌏', color:'#2fb6c9', color2:'#5fe08a', glow:'#ffffff', dark:'#0d4a52',
    core:'#ffffff', mul:1.83, rateMul:1.75, dmgBoost:0.40,
    desc:'攻速 +75% · 伤害 -60% · DPS 持平' },                              // 1.83×0.40×1.75 = 1.281
  { id:'basket',   name:'篮球', en:'BASKET',   ico:'🏀', color:'#ff8c1a', color2:'#3a2a1a', glow:'#ffd9a0', dark:'#8a4a08',
    core:'#ffffff', mul:0.86, bounce:3,
    desc:'撞墙/撞坦克最多反弹 3 次' },                                       // 反弹增益 ≈×1.49
  { id:'cyber',    name:'赛博', en:'CYBER',    ico:'🧬', color:'#28e0c8', color2:'#ff3df0', glow:'#ffffff', dark:'#0a3f4a',
    core:'#ffffff', mul:1.28, morphChance:0.25,
    desc:'25% 概率把敌人永久变成随机动物' },                                 // 纯外观，无战斗收益
  { id:'rock',     name:'巨石', en:'ROCK',     ico:'🗿', color:'#8a8073', color2:'#6b4a2a', glow:'#d8cbb8', dark:'#33302a',
    core:'#ffffff', mul:1.70, rateMul:0.35, dmgBoost:2.0, sizeMul:2.0,
    ignoreResist:true, wallBreakMul:2,
    desc:'攻速-65% · 伤害+100% · 弹径+100% · 无视抗性' },                    // 1.70×2.0×0.35×1.073 = 1.277
  { id:'liberty',  name:'自由', en:'LIBERTY',  ico:'🗽', color:'#17a86a', color2:'#cd7f32', glow:'#b8ffdc', dark:'#0a4a2e',
    core:'#ffffff', mul:1.01, weakMul:16.0, rageChance:0.30,
    desc:'弱点伤害 ×16（+1500%）· 30% 激怒敌人' },                             // ×16 增益 ≈×2.0+，激怒惩罚 ≈×0.85
  { id:'magnet',   name:'司南', en:'MAGNET',   ico:'🧲', color:'#e0342e', color2:'#2e6fe0', glow:'#ffffff', dark:'#2a0f1e',

const TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rand(a, b){ return a + Math.random() * (b - a); }
function randInt(a, b){ return Math.floor(rand(a, b + 1)); }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
/** 全随机生成一个常用汉字（CJK 统一表意文字基本区） */
function randChineseChar(){
  return String.fromCharCode(0x4E00 + Math.floor(Math.random() * (0x9FA5 - 0x4E00 + 1)));
}
function dist2(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by){ return Math.sqrt(dist2(ax, ay, bx, by)); }
function lerp(a, b, t){ return a + (b - a) * t; }
/** 角度最短插值 */
function angLerp(a, b, t){
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}
function angDiff(a, b){
  return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
}
function fmt(n){ return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n)); }

/** #rgb / #rrggbb → rgba() 字符串 */
function hexToRgba(hex, a){
  let h = String(hex || '').charAt(0) === '#' ? String(hex).slice(1) : String(hex || '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  if (isNaN(n)) return 'rgba(255,255,255,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
/** 按比例压暗（k<1）一个 #hex 颜色，返回 rgb() 字符串。k 量化到 1/16 并缓存，避免渲染循环里反复计算 */
const _shadeCache = Object.create(null);
function shadeHex(hex, k){
  if (!hex || hex.charAt(0) !== '#') return hex;
  const q = Math.round(k * 16) / 16;
  const key = hex + '|' + q;
  const hit = _shadeCache[key];
  if (hit) return hit;
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  if (isNaN(n)) return hex;
  const r = clamp(Math.round(((n >> 16) & 255) * q), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * q), 0, 255);
  const b = clamp(Math.round((n & 255) * q), 0, 255);
  const out = 'rgb(' + r + ',' + g + ',' + b + ')';
  _shadeCache[key] = out;
  return out;
}
/** 朝白色混合，返回 rgb() 字符串（t=0 原色，t=1 纯白），用于"更亮"的暴击数字等 */
function lighten(hex, t){
  t = clamp(t == null ? 0.5 : t, 0, 1);
  let h = String(hex || '').charAt(0) === '#' ? String(hex).slice(1) : String(hex || '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  if (isNaN(n)) return hex;
  const r = Math.round(((n >> 16) & 255) + (255 - ((n >> 16) & 255)) * t);
  const g = Math.round(((n >> 8) & 255) + (255 - ((n >> 8) & 255)) * t);
  const b = Math.round((n & 255) + (255 - (n & 255)) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

  earth:   ['#2fb6c9', '#ffffff'],                // 地球：蓝-白

  magnet:  ['#e0342e', '#2e6fe0']                 // 司南：红-蓝
};
function beamPalette(attrId){
  const p = BEAM_PALETTE[attrId];
  if (p) return p;
  const a = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  return [a.color];                                // 其余元素：单色（保持原样）
}
function beamColorAt(attrId, phase){
  const p = beamPalette(attrId);
  return p[(((phase | 0) % p.length) + p.length) % p.length];
}
/** 柔光贴图缓存（云絮 / 细胞辉光），避免每帧建径向渐变 */
const _puffCache = Object.create(null);
function puffSprite(color){
  if (_puffCache[color]) return _puffCache[color];
  try {
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    if (!g) return null;
    const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, hexToRgba(color, 0.95));
    rg.addColorStop(0.45, hexToRgba(color, 0.42));
    rg.addColorStop(1, hexToRgba(color, 0));
    g.fillStyle = rg;
    g.fillRect(0, 0, s, s);
    _puffCache[color] = c;
    return c;
  } catch (e) { return null; }
}

/* ============================================================
   音效（WebAudio 合成，无外部资源）
   ============================================================ */
const SFX = {
  ac: null,
  master: null,
  ok: true,
  init: function(){
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.ok = false; return; }
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ac.destination);
    } catch (e) { this.ok = false; }
  },
  resume: function(){ if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  /** 单音 */
  tone: function(freq, dur, type, vol, freq2){
    if (!this.ok || !this.ac) return;
    try {
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.3 : vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },
  /** 噪声 */
  noise: function(dur, vol, cut, q){
    if (!this.ok || !this.ac) return;
    try {
      const t = this.ac.currentTime;
      const len = Math.max(1, Math.floor(this.ac.sampleRate * dur));
      const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ac.createBufferSource();
      src.buffer = buf;
      const f = this.ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(cut || 1200, t);
      f.Q.value = q || 1;
      const g = this.ac.createGain();
      g.gain.setValueAtTime(vol == null ? 0.3 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t);
    } catch (e) {}
  },
  shoot: function(ammoId){
    if (ammoId === 'laser'){
      this.tone(1500, 0.10, 'sawtooth', 0.16, 320);
      this.noise(0.06, 0.06, 5200);

    }
  },
  hit: function(){ this.tone(1150, 0.045, 'square', 0.075, 700); },

  },

  swAttr: function(i){

  hurt: function(){ this.tone(180, 0.20, 'sawtooth', 0.24, 62); this.noise(0.16, 0.20, 700); },

/* ============================================================
   地图
   ============================================================ */
function tileAt(tx, ty){
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return 2;
  return grid[ty][tx];
}
function wallAtPx(px, py){
  return tileAt((px / TILE) | 0, (py / TILE) | 0);
}
function isSolid(px, py){ return tileAt((px / TILE) | 0, (py / TILE) | 0) !== 0; }
function centerOf(tx, ty){ return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 }; }

function genMap(){
  grid = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++){
      const border = (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1);
      row.push(border ? 2 : 0);
    }
    grid.push(row);
  }
  // 出生点保护半径（格）
  const cx = (MAP_W / 2) | 0, cy = (MAP_H / 2) | 0;
  const guard = 4;

  // 随机砖块簇
  for (let i = 0; i < 78; i++){
    const bx = randInt(2, MAP_W - 3), by = randInt(2, MAP_H - 3);
    if (Math.abs(bx - cx) <= guard && Math.abs(by - cy) <= guard) continue;
    const w = randInt(1, 4), h = randInt(1, 3);
    for (let y = by; y < Math.min(by + h, MAP_H - 1); y++){
      for (let x = bx; x < Math.min(bx + w, MAP_W - 1); x++){
        if (Math.random() < 0.82) grid[y][x] = 1;
      }
    }
  }
  // 钢结构掩体
  for (let i = 0; i < 16; i++){
    const bx = randInt(3, MAP_W - 5), by = randInt(3, MAP_H - 5);
    if (Math.abs(bx - cx) <= guard && Math.abs(by - cy) <= guard) continue;
    const len = randInt(2, 5);
    const vert = Math.random() < 0.5;
    for (let k = 0; k < len; k++){
      const x = bx + (vert ? 0 : k), y = by + (vert ? k : 0);
      if (x > 1 && y > 1 && x < MAP_W - 2 && y < MAP_H - 2) grid[y][x] = 2;
    }
  }
  // 清出几条通道，避免死图
  for (let i = 0; i < 6; i++){
    let x = randInt(2, MAP_W - 3), y = randInt(2, MAP_H - 3);
    const dir = randInt(0, 3);
    const dx = dir === 0 ? 1 : dir === 1 ? -1 : 0;
    const dy = dir === 2 ? 1 : dir === 3 ? -1 : 0;
    for (let k = 0; k < randInt(8, 20); k++){
      x = clamp(x + dx, 2, MAP_W - 3);
      y = clamp(y + dy, 2, MAP_H - 3);
      if (grid[y][x] === 1) grid[y][x] = 0;
    }
  }
  ensureConnected();

  // 构建墙体渲染缓存
  walls.length = 0;
  for (let y = 0; y < MAP_H; y++){
    for (let x = 0; x < MAP_W; x++){
      const t = grid[y][x];
      if (t === 0) continue;
      walls.push({ tx: x, ty: y, type: t, hp: t === 1 ? 3 : Infinity, hitFlash: 0, seed: Math.random() });
    }
  }
}

/** Bresenham 直线挖通：清空路径上的一切墙体（含钢墙），边界除外 */
function carveLine(x0, y0, x1, y1){
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  // 同行/同列时步长必须为 0，否则会朝反方向无限走而永远到不了终点
  const sx = x0 < x1 ? 1 : (x0 > x1 ? -1 : 0);
  const sy = y0 < y1 ? 1 : (y0 > y1 ? -1 : 0);
  let err = dx - dy;
  let x = x0, y = y0;
  let guard = 0;
  while (guard++ < 500){
    if (x > 0 && y > 0 && x < MAP_W - 1 && y < MAP_H - 1 && grid[y][x] !== 0) grid[y][x] = 0;
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy){ err -= dy; x += sx; }
    if (e2 < dx){ err += dx; y += sy; }
  }
}
/**
 * 保证地图连通：把与出生点不连通的孤立空地区域，各挖一条通道接回主区。
 * 否则敌人会刷在与玩家隔绝的孤岛里，永远打不到。
 * 迭代多轮，直到没有孤立区（单轮挖通可能仍被钢墙隔断）。
 */
function ensureConnected(){
  const N = MAP_W * MAP_H;
  const cx = (MAP_W / 2) | 0, cy = (MAP_H / 2) | 0;
  const q = new Int32Array(N);

  /** 从 (cx,cy) 洪水填充，返回可达标记 */
  function flood(){
    const seen = new Uint8Array(N);
    let head = 0, tail = 0;
    const start = cy * MAP_W + cx;
    seen[start] = 1;
    q[tail++] = start;
    while (head < tail){
      const cur = q[head++];
      const x = cur % MAP_W, y = (cur / MAP_W) | 0;
      for (let k = 0; k < 4; k++){
        const nx = x + DIR4[k][0], ny = y + DIR4[k][1];
        if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
        const ni = ny * MAP_W + nx;
        if (seen[ni] || grid[ny][nx] !== 0) continue;
        seen[ni] = 1;
        q[tail++] = ni;
      }
    }
    return seen;
  }

  for (let round = 0; round < 4; round++){
    if (grid[cy][cx] !== 0) grid[cy][cx] = 0;
    const seen = flood();
    // 按连通分量找出每个孤立区的代表点
    const orphan = [];
    for (let i = 0; i < N; i++){
      const y = (i / MAP_W) | 0, x = i % MAP_W;
      if (grid[y][x] === 0 && !seen[i]) orphan.push(i);
    }
    if (!orphan.length) return;
    const grouped = new Uint8Array(N);
    for (let i = 0; i < orphan.length; i++){
      const oi = orphan[i];
      if (grouped[oi]) continue;
      let rep = oi;
      const stack = [oi];
      grouped[oi] = 1;
      while (stack.length){
        const cur = stack.pop();
        rep = cur;
        const x = cur % MAP_W, y = (cur / MAP_W) | 0;
        for (let k = 0; k < 4; k++){
          const nx = x + DIR4[k][0], ny = y + DIR4[k][1];
          if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
          const ni = ny * MAP_W + nx;
          if (grouped[ni] || seen[ni] || grid[ny][nx] !== 0) continue;
          grouped[ni] = 1;
          stack.push(ni);
        }
      }
      carveLine(rep % MAP_W, (rep / MAP_W) | 0, cx, cy);
    }
  }
  // 兜底：若仍有孤立空地（被边界围死的极少数情况），直接封成砖墙，
  // 确保其不会成为敌人生成的死角
  const seenEnd = flood();
  for (let i = 0; i < N; i++){
    if (seenEnd[i]) continue;
    const y = (i / MAP_W) | 0, x = i % MAP_W;
    if (grid[y][x] !== 0) continue;
    if (x <= 0 || y <= 0 || x >= MAP_W - 1 || y >= MAP_H - 1) continue;
    grid[y][x] = 1;
  }
}

/* ============================================================
   流场寻路：以玩家为源点做 BFS，敌人沿梯度靠拢
   —— 解决敌人被凹形墙体卡死的问题
   ============================================================ */
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const flowDist = new Int32Array(MAP_W * MAP_H);
const flowQueue = new Int32Array(MAP_W * MAP_H);
let flowTimer = 0;

function computeFlowField(){
  flowDist.fill(-1);
  if (!player) return;
  const sx = clamp(Math.floor(player.x / TILE), 0, MAP_W - 1);
  const sy = clamp(Math.floor(player.y / TILE), 0, MAP_H - 1);
  let head = 0, tail = 0;
  const start = sy * MAP_W + sx;
  if (grid[sy][sx] !== 0){
    // 玩家所在格是墙（极少见）：退化为空流场，敌人直冲
    return;
  }
  flowDist[start] = 0;
  flowQueue[tail++] = start;
  while (head < tail){
    const cur = flowQueue[head++];
    const cxx = cur % MAP_W, cyy = (cur / MAP_W) | 0;
    const d = flowDist[cur];
    for (let k = 0; k < 4; k++){
      const nx = cxx + DIR4[k][0], ny = cyy + DIR4[k][1];
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      const ni = ny * MAP_W + nx;
      if (flowDist[ni] !== -1 || grid[ny][nx] !== 0) continue;
      flowDist[ni] = d + 1;
      flowQueue[tail++] = ni;
    }
  }
}
/** 返回 (tx,ty) 的下一格（dist 更小的邻格），没有则返回 null */
function flowNext(tx, ty){
  const cur = flowDist[ty * MAP_W + tx];
  if (cur <= 0) return null;
  let best = cur, bx = -1, by = -1;
  for (let k = 0; k < 4; k++){
    const nx = tx + DIR4[k][0], ny = ty + DIR4[k][1];
    if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
    const nd = flowDist[ny * MAP_W + nx];
    if (nd < 0) continue;
    if (nd < best){ best = nd; bx = nx; by = ny; }
  }
  return bx >= 0 ? { x: bx, y: by } : null;
}
function wallRefAt(tx, ty){
  // 墙体缓存里查找（地图不大，线性查找足够；用索引表更快）
  if (!wallIndex) return null;
  return wallIndex[ty * MAP_W + tx] || null;
}
let wallIndex = null;
function rebuildWallIndex(){
  wallIndex = Object.create(null);
  for (let i = 0; i < walls.length; i++) wallIndex[walls[i].ty * MAP_W + walls[i].tx] = walls[i];
}

function damageWall(tx, ty, amount){
  const t = tileAt(tx, ty);
  if (t === 0) return false;
  if (t === 2) return false;                       // 钢墙不可破
  const w = wallRefAt(tx, ty);
  if (!w) return false;
  w.hp -= amount;
  w.hitFlash = 1;
  if (w.hp <= 0){
    grid[ty][tx] = 0;
    const i = walls.indexOf(w);
    if (i >= 0) walls.splice(i, 1);
    delete wallIndex[ty * MAP_W + tx];
    // 碎块粒子
    const c = centerOf(tx, ty);
    for (let k = 0; k < 9; k++){
      const a = rand(0, TAU), s = rand(40, 190);
      particles.push({
        x: c.x + rand(-14, 14), y: c.y + rand(-14, 14),
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: rand(0.4, 0.9), max: 0.9, size: rand(2.5, 6),
        color: '#a8613c', type: 'shard', rot: rand(0, TAU), vr: rand(-9, 9), drag: 2.4, grav: 420
      });
    }
    SFX.wall();
    return true;
  }
  SFX.wall();
  return false;
}

  if (particles.length >= MAX_PARTICLES) particles.shift();

}

  opt = opt || {};
  if (texts.length > 70) texts.shift();

}

/* ============================================================
   伤害系统：属性克制 + 暴击 + 属性机制
   ============================================================ */
const WEAK_MUL = 1.65;     // 打中弱点
const RESIST_MUL = 0.5;    // 打中抗性
const BASE_CRIT = 0.1;
const CRIT_MUL = 1.8;
const BIO_SPLIT_CHANCE = 0.10;   // 生物：每次命中触发分裂的概率
const BIO_SPLIT_RATIO  = 0.3;    // 幼体的 最大生命 / 当前生命 = 母体对应值的 30%
const BIO_CHILD_DMG    = 0.5;    // 幼体攻击力减半
const INK_DUR = 3.4;             // 文墨：墨染持续时间（秒）
const VULN_MUL = 1.2;            // 湮灭：命中后目标对其余元素易伤 +20%
const CONFUSE_DUR = 5.0;         // 衍射：混乱持续时间（秒）
const BAT_DUR = 8.0;             // 染血：吸血蝙蝠存在时间（秒）
const SKY_BUFF_DUR = 3.0;        // 天空：自身移速/攻速增益持续时间（秒）
const RAINBOW_HEAL_REF = 44;     // 穿甲弹基准伤害（回复 10% 最大生命）；其余按伤害等比
const RAINBOW_HEAL_BASE = 0.10;  // 穿甲弹回复比例
const RAGE_DUR = 4.0;            // 自由：激怒持续时间（秒）
const MAG_DUR  = 10.0;           // 司南：磁场持续时间（秒）
const MAG_RANGE = 200;           // 司南：磁性弹幕作用半径（px）
const MAG_FORCE = 2200;          // 司南：磁场力峰值（px/s²），随距离线性衰减

/**
 * 随机倍率元素（魔术 1~6 / 数学 0~9）：把 [lo,hi] 均匀整数归一化为均值 1.0。
 * 直接乘 randInt(lo,hi) 会让期望值变成 3.5 或 4.5 倍，直接破坏平衡，
 * 所以除以区间均值 —— 保留全部随机性，期望严格锁在 1.0。
 */
function rollRandMul(attr){
  if (attr.randLo == null || attr.randHi == null) return 1;
  const lo = attr.randLo, hi = attr.randHi;
  const mean = (lo + hi) / 2;
  if (!(mean > 0)) return 1;
  return (lo + ((Math.random() * (hi - lo + 1)) | 0)) / mean;
}

/**
 * 综合倍率 = mul × dmgBoost × rateMul，即该元素的 DPS 水平。
 * HUD 展示这个而不是裸 mul —— 地球的裸 mul 1.83 看着最高，
 * 但单发伤害 ×0.4，只看 mul 会误判成最强元素。
 */
function attrDpsMul(attr){
  return (attr.mul == null ? 1 : attr.mul) * (attr.dmgBoost || 1) * (attr.rateMul || 1);
}

/**
 * 纯计算：返回本次命中的最终伤害与标签
 * @returns {{dmg:number, crit:boolean, tag:string}}
 */
function computeDamage(base, attrId, target, glyphIdx){
  const attr = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  // 元素倍率（无特性元素更高） × 局内等级伤害加成 × 元素自带的伤害增益（地球 -60% / 巨石 +100%）
  let mul = (attr.mul == null ? 1 : attr.mul) * (attr.dmgBoost || 1) * lvlDmgMul();
  let tag = '';
  if (target){
    // 弱点 / 抗性是数组（元素多了以后每敌带 3 个），不能用 === 比较
    const isWeak   = target.weak   && target.weak.indexOf(attrId) >= 0;
    const isResist = target.resist && target.resist.indexOf(attrId) >= 0;
    // 巨石无视抗性：抗性判定直接作废（这也是它综合倍率里 1.073 那部分收益的来源）
    if (isResist && attr.ignoreResist){ /* 无视抗性，不打折也不加成 */ }
    else if (isWeak){
      // 测试工坊可为每个弱点单独配置强度；否则用元素自带 weakMul 或全局 WEAK_MUL
      const wm = (target.weakStr && target.weakStr[attrId] != null) ? target.weakStr[attrId]
               : (attr.weakMul || WEAK_MUL);
      mul *= wm;
      tag = attr.weakMul ? '弱点+' : '弱点';
    }
    else if (isResist){
      // 测试工坊可为每个抗性单独配置强度；否则用全局 RESIST_MUL
      const rm = (target.resistStr && target.resistStr[attrId] != null) ? target.resistStr[attrId]
               : RESIST_MUL;
      mul *= rm; tag = '抗性';
    }
    // 湮灭易伤：被湮灭命中后，对其余元素受伤 +20%（不与弱点/抗性叠加显示时取首个标签）
    else if (target.vuln > 0 && attrId !== 'havoc'){ mul *= VULN_MUL; tag = '易伤'; }
  }
  // 暴击：物理稳定暴击流 +30%；血染永不暴击
  let critRate = BASE_CRIT;
  if (attrId === 'physical') critRate += 0.30;
  else if (attrId === 'blood') critRate = 0;
  // 生物：命中被分裂产生的幼体（split=true），暴击率 +50%
  if (attr.id === 'bio' && target && target.split) critRate += 0.50;
  const crit = Math.random() < critRate;
  if (crit) mul *= CRIT_MUL;

  // 随机倍率元素（魔术 / 数学）：均值 1.0，但单发在 0.29~1.71 或 0~2.0 之间剧烈波动
  let roll = 0;
  if (attr.randLo != null){
    roll = rollRandMul(attr);
    mul *= roll;
  }

  // 数学：固定伤害（无法暴击，一切因素不可修改）。仅 i 走常规伤害并触发特殊机制。
  if (attr.id === 'math' && glyphIdx != null){
    const glyph = MATH_GLYPHS[glyphIdx];
    if (glyph !== 'i'){
      const a = MATH_CONST[glyph];
      // 0.1*a 概率触发特殊机制：把目标血量降到命中前的 0.1*a 倍（在 hurtEnemy 里执行）
      const pct = Math.random() < 0.1 * a;
      return { dmg: a, crit: false, tag: pct ? 'mathpct' : 'math', roll: 0,
               fixed: true, mathVal: a, glyph: glyph };
    }
    // i：落到下面的常规计算（暴击 / 弱点 / 抗性照常生效）
  }

  return { dmg: base * mul, crit: crit, tag: tag, roll: roll };
}

/* 赛博：动物形态池（纯外观改造，不改任何战斗数值） */
const ANIMALS = ['🐺','🦊','🐻','🐼','🐷','🐸','🐵','🦁','🐯','🦉','🐔','🐧','🐙','🦀','🐳','🦖'];
/* 赛博：乱码字符池（半角片假名 + 符号，密度高、辨识度强，适合做数据流乱码） */
const GLYPH_CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789#%&@*+=<>/\\|'.split('');
/* 数学：八段码段位表，位序 a,b,c,d,e,f,g（0=灭 1=亮） */
const SEG7 = [0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F];
/* 数学：弹幕字形顺序与对应真实常数值（伤害显示保留 3 位小数）。
   i 为虚数单位：走常规伤害、不触发固定/百分比机制（见 computeDamage / hurtEnemy）。 */
const MATH_GLYPHS = ['e', 'π', 'i', 'φ', 'γ', 'G', 'δ', '√2', 'ζ(3)'];
const MATH_CONST  = {
  e: 2.71828182845904, π: 3.14159265358979, i: 0,
  φ: 1.61803398874989, γ: 0.57721566490153, G: 0.91596559417721,
  δ: 4.66920160910299, '√2': 1.41421356237309, 'ζ(3)': 1.20205690315959
};
const MATH_FONT = '"Cambria","Georgia","Times New Roman",serif';

/**
 * 属性附加机制（命中后触发）
 * @param {object} [extra] 附加上下文，目前只用于司南传递子弹磁极（extra.pole）
 */
function applyAttrEffect(attrId, target, x, y, dmg, srcAng, extra){
  const a = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  switch (attrId){
    case 'fusion':
      // 热熔：附加灼烧（配色随来源元素）
      target.burn = Math.max(target.burn || 0, 2.6);
      target.burnDps = Math.max(target.burnDps || 0, dmg * 0.28);
      target.burnAttr = attrId;
      break;

    case 'glacio':
      // 冷凝：减速
      target.slow = Math.max(target.slow || 0, 1.7);
      target.slowMul = 0.42;
      break;

    case 'electro': {
      // 导电：向附近至多 5 个未命中目标链式跳跃，造成连锁闪电轻微伤害
      let chains = 0;
      const sorted = enemies.filter(function(e){
        return e !== target && !e.dead && dist2(e.x, e.y, x, y) < 240 * 240;
      }).sort(function(a, b){ return dist2(a.x, a.y, x, y) - dist2(b.x, b.y, x, y); });
      for (let i = 0; i < sorted.length && chains < 5; i++){
        const e = sorted[i];
        arcs.push({ x1: x, y1: y, x2: e.x, y2: e.y, life: 0.2, max: 0.2, color: a.glow, seg: 7, w: 2.2 });
        const r = computeDamage(dmg * 0.4, attrId, e);
        hurtEnemy(e, r.dmg, attrId, e.x, e.y, r.crit, r.tag, true);
        chains++;
      }
      break;
    }

    case 'aero':
      // 气动：击退
      if (srcAng != null && !target.def.boss){
        const kb = 320;
        target.vx = (target.vx || 0) + Math.cos(srcAng) * kb;
        target.vy = (target.vy || 0) + Math.sin(srcAng) * kb;
      }
      break;

    case 'spectro':
      // 衍射：10% 概率使敌人混乱，攻击自己的队友，持续 5 秒
      if (!target.dead && Math.random() < 0.10){
        target.confuse = CONFUSE_DUR;
        rings.push({ x: target.x, y: target.y, r: target.r, max: target.r * 3.4, life: 0.42, max_life: 0.42, color: a.glow, w: 2.6 });
        addText(target.x, target.y - target.r - 14, '混乱!', a.glow, { size: 15, bold: true, life: 1.0, vy: -30 });
      }
      break;

    case 'havoc':
      // 湮灭：命中后该敌人对其余元素易伤 +20%，持续 5 秒
      if (!target.dead){
        target.vuln = 5.0;
        rings.push({ x: target.x, y: target.y, r: target.r * 2.4, max: target.r * 0.8, life: 0.42, max_life: 0.42, color: a.color, w: 2.6, inwards: true });
        addText(target.x, target.y - target.r - 14, '易伤!', a.glow, { size: 14, bold: true, life: 1.0, vy: -30 });
      }
      break;

    case 'ink':
      // 文墨：固定 20% 概率触发墨染 + 敌人随机汉字喊话（白宋体，字号与坦克等大）
      if (!target.dead && Math.random() < 0.20){
        target.ink = Math.max(target.ink || 0, INK_DUR);
        target.shoutChar = randChineseChar();
        target.shoutT = 2.4;
        rings.push({ x: target.x, y: target.y, r: target.r * 2.2, max: target.r * 0.9,
          life: 0.36, max_life: 0.36, color: a.glow, w: 2.4, inwards: true });
        addText(target.x, target.y - target.r - 14, '！', a.glow, { size: 14, bold: true, life: 0.8, vy: -30 });
      }
      break;

    case 'blood':
      // 染血：永不暴击（见 computeDamage）；20% 概率召唤吸血蝙蝠追击敌人
      if (!target.dead && Math.random() < 0.20) summonBat(target.x, target.y);
      break;

    case 'sky':
      // 天空：10% 概率自身移速 +100%、攻速 +100%，持续 3 秒
      if (Math.random() < 0.10){
        player.buffSpeed = SKY_BUFF_DUR;
        player.buffAtk = SKY_BUFF_DUR;
        rings.push({ x: player.x, y: player.y, r: player.r * 2.2, max: player.r * 0.7, life: 0.5, max_life: 0.5, color: a.color, w: 3, inwards: true });
        rings.push({ x: player.x, y: player.y, r: player.r * 1.2, max: player.r * 4.4, life: 0.5, max_life: 0.5, color: a.glow, w: 2.4 });
        addText(player.x, player.y - player.r - 16, '升空!', a.glow, { size: 15, bold: true, life: 1.0, vy: -30 });
      }
      break;

    case 'rainbow':
      // 彩虹：5% 概率回血，回复量∝攻击伤害；穿甲弹回复最大生命 10%，其余按伤害等比
      if (!player.dead && Math.random() < 0.05){
        const ammo = curAmmo();
        const frac = RAINBOW_HEAL_BASE * (ammo.dmg / RAINBOW_HEAL_REF);
        const heal = Math.min(player.maxHp - player.hp, Math.max(1, player.maxHp * frac));
        if (heal > 0){
          player.hp += heal;
          rings.push({ x: player.x, y: player.y, r: player.r * 1.4, max: player.r * 0.6, life: 0.45, max_life: 0.45, color: a.color, w: 3, inwards: true });
          addText(player.x, player.y - player.r - 16, '+' + Math.round(heal) + ' 回复', '#ffffff', { size: 15, bold: true, life: 1.0, vy: -30 });
        }
      }
      break;

    case 'bio':
      // 生物：命中非 Boss 目标时，10% 概率使其分裂为 2 个幼体
      if (!target.def.boss && !target.dead && target.canSplit !== false && target.hp > 0){
        if (Math.random() < BIO_SPLIT_CHANCE) splitEnemy(target);
      }
      break;

    case 'cyber':
      // 赛博：25% 概率把敌人永久改造成随机动物形态（纯外观，战斗数值一律不变）
      // 已变形的目标不再重复变形，避免形态乱跳
      if (!target.dead && !target.animal && Math.random() < (a.morphChance || 0.25)){
        target.animal = pick(ANIMALS);
        target.morphT = 0.55;                 // 变形动画计时
        rings.push({ x: target.x, y: target.y, r: target.r * 2.6, max: target.r * 0.7,
          life: 0.4, max_life: 0.4, color: a.color2 || a.color, w: 3, inwards: true });
        rings.push({ x: target.x, y: target.y, r: target.r * 0.6, max: target.r * 3.6,
          life: 0.45, max_life: 0.45, color: a.color, w: 2.2 });
        addText(target.x, target.y - target.r - 15, '变形!', a.glow, { size: 15, bold: true, life: 1.0, vy: -30 });
        // 乱码爆散
        for (let i = 0; i < 22; i++){
          const ang = rand(0, TAU), s = rand(60, 260);
          pushParticle({
            x: target.x, y: target.y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s,
            life: rand(0.3, 0.7), max: 0.7, size: rand(3, 6),
            color: i % 2 ? (a.color2 || a.color) : a.color,
            type: 'glyph', ch: GLYPH_CHARS[(Math.random() * GLYPH_CHARS.length) | 0],
            drag: 2.4, rot: rand(0, TAU), vr: rand(-6, 6)
          });
        }
      }
      break;

    case 'liberty':
      // 自由：30% 概率激怒敌人 —— 移速与攻速 ×2，持续 4 秒。
      // 这不是 bug，是它「对弱点 ×5 伤害」的定价成本。
      if (!target.dead && !(target.rage > 0) && Math.random() < (a.rageChance || 0.30)){
        target.rage = RAGE_DUR;
        rings.push({ x: target.x, y: target.y, r: target.r * 0.8, max: target.r * 3.2,
          life: 0.45, max_life: 0.45, color: a.color2 || a.color, w: 3 });
        addText(target.x, target.y - target.r - 15, '激怒!', '#ffd27a', { size: 15, bold: true, life: 1.0, vy: -30 });
      }
      break;

    case 'magnet': {
      // 司南：命中施加磁场（红 N / 蓝 S），10 秒内磁极冻结不可改写
      if (target.dead) break;
      const pole = (extra && extra.pole) ? extra.pole : (Math.random() < 0.5 ? 1 : -1);
      const col = pole > 0 ? (a.color || '#e0342e') : (a.color2 || '#2e6fe0');
      if (target.magT > 0 && target.pole && target.pole !== pole){
        // 异性磁极碰撞 → 磁暴（攻击伤害 25% + 短暂减速 + 视觉爆发）
        const stormDmg = wsScaleEnemyDmg(dmg * 0.25);   // 攻击伤害的 25%
        target.hp -= stormDmg;
        if (state.workshop) target.hp = target.maxHp;
        target.slow = Math.max(target.slow || 0, 0.6);
        target.slowMul = 0.65;
        addText(target.x, target.y - target.r - 12, '磁暴! -' + Math.max(1, Math.round(stormDmg)), col, { size: 16, bold: true, life: 0.9, vy: -28 });
        // 磁暴视觉：红蓝交错电弧 + 粒子爆散
        for (let si = 0; si < 3; si++){
          const sa = Math.sin(state.time * 20 + si * 2.1) > 0 ? a.color : (a.color2 || a.color);
          arcs.push({ x1: target.x, y1: target.y - target.r,
            x2: target.x + rand(-target.r*2, target.r*2), y2: target.y + rand(-target.r*2, target.r*2),
            life: 0.28, max: 0.28, color: sa, seg: 6, w: 2 });
        }
        for (let pi = 0; pi < 14; pi++){
          const pa = rand(0, TAU), ps = rand(50, 180);
          pushParticle({
            x: target.x, y: target.y,
            vx: Math.cos(pa) * ps, vy: Math.sin(pa) * ps,
            life: rand(0.25, 0.5), max: 0.5, size: rand(2, 5),
            color: pi % 2 ? a.color : (a.color2 || a.color), type: 'spark', drag: 4
          });
        }
        rings.push({ x: target.x, y: target.y, r: target.r * 0.6, max: target.r * 3.5,
          life: 0.35, max_life: 0.35, color: '#ffffff', w: 2.5 });
        if (target.hp <= 0) killEnemy(target, attrId);
        break;
      }
      if (target.magT > 0){
        // 已带磁场：同性磁极 → 只给一次「磁极被锁」的反馈，不刷新也不改写
        rings.push({ x: target.x, y: target.y, r: target.r * 1.5, max: target.r * 2.2,
          life: 0.24, max_life: 0.24, color: col, w: 1.6 });
        break;
      }
      target.pole = pole;
      target.magT = a.magDur || MAG_DUR;
      rings.push({ x: target.x, y: target.y, r: target.r * 2.8, max: target.r * 1.1,
        life: 0.4, max_life: 0.4, color: col, w: 3, inwards: true });
      addText(target.x, target.y - target.r - 15, pole > 0 ? 'N 磁化' : 'S 磁化', col,
        { size: 14, bold: true, life: 1.0, vy: -30 });
      break;
    }

    // physical / magic / earth / basket / rock / math：
    // 这几个的特性全部落在 computeDamage / tryFire / updateBullets 里
    // （随机倍率、攻速、弹径、反弹、无视抗性），命中瞬间无额外动作
  }
}

/**
 * 升级：提升最大生命 / 伤害 / 射速 / 移速，并回复一部分装甲。
 * 所有派生数值都从 level 计算，保证重开后不会累积漂移。
 */
function levelUp(){
  player.level++;
  player.xpNext = xpForLevel(player.level);

  const oldMax = player.maxHp;
  player.maxHp = LVL.baseHp + (player.level - 1) * LVL.hpPerLv;
  player.hp += player.maxHp - oldMax;          // 新增的上限直接补满
  player.speed = lvlSpeed();

  const heal = Math.min(player.maxHp - player.hp, Math.round(player.maxHp * LVL.healPct));
  if (heal > 0) player.hp += heal;

  // --- 升级表现 ---
  rings.push({ x: player.x, y: player.y, r: player.r * 1.2, max: player.r * 4.8,
    life: 0.55, max_life: 0.55, color: '#b7c4ff', w: 3.4 });
  rings.push({ x: player.x, y: player.y, r: player.r * 3.8, max: player.r * 0.7,
    life: 0.45, max_life: 0.45, color: '#7c8cff', w: 2.2, inwards: true });
  for (let i = 0; i < 28; i++){
    const a = (i / 28) * TAU + rand(-0.12, 0.12);
    const s = rand(90, 240);
    pushParticle({
      x: player.x + Math.cos(a) * player.r, y: player.y + Math.sin(a) * player.r,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.35, 0.8), max: 0.8, size: rand(2, 4.6),
      color: pick(['#ffffff', '#b7c4ff', '#7c8cff']), type: 'spark', drag: 2.6
    });
  }
  addText(player.x, player.y - 48, 'LEVEL ' + player.level, '#dfe4ff',
    { size: 27, bold: true, life: 1.6, vy: -32, vx: 0 });
  if (heal > 0){
    addText(player.x, player.y - 24, '+' + heal + ' 装甲', '#34d399',
      { size: 14, bold: true, life: 1.2, vy: -24, vx: 0 });
  }
  state.shake = Math.max(state.shake, 4);
  SFX.levelUp();
  updateHUD();
}

/** 获得经验，可连续升级 */
function gainXp(amount){
  if (!player || player.dead || !(amount > 0)) return;
  player.xp += amount;
  let guard = 0;
  while (player.xp >= player.xpNext && guard++ < 60){
    player.xp -= player.xpNext;
    levelUp();
  }
  updateLevelHUD();
}

/* ============================================================
   敌人
   ============================================================ */
/* ---------------- 弱点 / 抗性：槽位数与发牌 ----------------
   问题：元素从 7 种涨到 20 种后，若每个敌人仍只带 1 个弱点，
   「当前元素恰好命中弱点」的概率会从 1/7 ≈ 14.3% 掉到 1/20 = 5%，
   克制系统形同虚设 —— 滚轮切换元素就失去了意义。

   对策一：槽位数随元素总数等比放大，把单元素命中率锁回 ≈1/7。
       slots = max(1, round(N / 7))      N=7→1, N=14→2, N=20→3
       20 元素时每敌 3 弱点 + 3 抗性，单元素弱点率 3/20 = 15%。

   对策二：洗牌袋发牌，而不是每次独立随机抽样。
       独立抽样是二项分布，长尾会让某些元素连续几十次不出现；
       洗牌袋把 20 个 id 打乱后依次发，发完重洗，
       保证任意一段区间内各元素出现次数之差 ≤ 1，全局严格均等。

   约束：弱点集与抗性集必须互斥。若同一元素既是弱点又是抗性，
        ×1.65 与 ×0.5 会在同一次判定里互相抵消，属于自相矛盾。
----------------------------------------------------------- */
const WEAK_SLOTS   = Math.max(1, Math.round(ATTRS.length / 7));
const RESIST_SLOTS = WEAK_SLOTS;
let weakBag = [], resistBag = [];

/* ============================================================
   测试工坊：配置默认值与数值注入点
   - 我方/敌方 攻击力、防御力（减伤比例）、移速、攻速
   - 敌方每个元素的「弱点/抗性」勾选 + 各自强度
   这些函数统一从这里读取，普通对局（非工坊）全部返回 1 / 0，不影响原平衡。
   ============================================================ */
const WS_DEFAULT = {
  enemyAtk: 1,      // 敌方攻击力倍率
  enemyDef: 0,      // 敌方防御力（减伤比例 0~0.9）
  playerAtk: 1,     // 我方攻击力倍率
  playerDef: 0,     // 我方防御力（减伤比例 0~0.9）
  playerSpeed: 1,   // 我方移动速度倍率
  playerAspd: 1,    // 我方攻击速度倍率（越大越快）
  weakOn: {},       // id -> true（该元素为弱点）
  weakStr: {},      // id -> 弱点强度（默认 WEAK_MUL）
  resistOn: {},     // id -> true（该元素为抗性）
  resistStr: {}     // id -> 抗性强度（默认 RESIST_MUL）
};
function wsActive(){ return state.workshop && wsCfg; }
function wsPlayerAtk(){ return wsActive() ? wsCfg.playerAtk : 1; }
function wsEnemyDefFrac(){ return wsActive() ? wsCfg.enemyDef : 0; }
function wsPlayerDefFrac(){ return wsActive() ? wsCfg.playerDef : 0; }
function wsSpeedMul(){ return wsActive() ? wsCfg.playerSpeed : 1; }
function wsAspdMul(){ return wsActive() ? wsCfg.playerAspd : 1; }
// 玩家对敌伤害：乘我方攻击力、扣敌方防御力
function wsScaleEnemyDmg(dmg){ return dmg * wsPlayerAtk() * (1 - wsEnemyDefFrac()); }

function reshuffleBag(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
}
function drawFromBag(bag){
  if (!bag.length){
    ATTRS.forEach(function(a){ bag.push(a.id); });
    reshuffleBag(bag);
  }
  return bag.pop();
}
/** 从袋中取 n 个互不重复、且不落在 exclude 内的元素 id */
function drawUnique(bag, n, exclude){
  const out = [], rejected = [];
  let guard = 0;
  while (out.length < n && guard++ < 500){
    const id = drawFromBag(bag);
    if (out.indexOf(id) >= 0 || (exclude && exclude.indexOf(id) >= 0)){ rejected.push(id); continue; }
    out.push(id);
  }
  // 被剔除的 id 必须放回袋中，否则其长期出现频次会被系统性压低
  for (let i = 0; i < rejected.length; i++) bag.push(rejected[i]);
  if (rejected.length) reshuffleBag(bag);
  return out;
}
function rollAttrs(wave){
  const weak   = drawUnique(weakBag,   WEAK_SLOTS,   null);
  const resist = drawUnique(resistBag, RESIST_SLOTS, weak);
  return { weak: weak, resist: resist };
}
function makeEnemy(typeId, wave){
  const def = ENEMY_DEFS[typeId];
  const a = rollAttrs(wave);
  const hp = Math.round(def.hp * (1 + (wave - 1) * 0.14));
  return {
    id: uid++,
    type: typeId,
    def: def,
    x: 0, y: 0,
    vx: 0, vy: 0,
    r: def.r,
    hp: hp, maxHp: hp,
    speed: def.speed,
    bodyAng: 0, turretAng: 0,
    cd: rand(0.4, def.cd),
    weak: a.weak, resist: a.resist,
    burn: 0, burnDps: 0, burnTick: 0,
    slow: 0, slowMul: 1,
    ink: 0,                  // 文墨：墨染剩余时间
    confuse: 0,              // 衍射：混乱剩余时间（攻击队友）
    vuln: 0,                 // 湮灭：对其余元素易伤剩余时间
    shoutT: 0,               // 文墨：喊话汉字剩余显示时间
    shoutChar: '',           // 文墨：喊出的随机汉字
    burnAttr: 'fusion',      // 灼烧来源元素（用于燃烧弹配色）
    rage: 0,                 // 自由：激怒剩余时间（移速/攻速 ×2）
    pole: 0,                 // 司南：磁场极性（+1 = N 红，-1 = S 蓝）
    magT: 0,                 // 司南：磁场剩余时间
    animal: '',              // 赛博：动物形态（空串 = 未变形）
    morphT: 0,               // 赛博：变形动画剩余时间
    canSplit: true,          // 生物：是否还能分裂（幼体为 false）
    split: false,            // 生物：是否为分裂产物（影响外观/分数）
    scoreMul: 1,
    dmgMul: 1,               // 个体攻击力系数（幼体为 0.5）
    hitFlash: 0,
    dead: false,
    avoidSide: Math.random() < 0.5 ? 1 : -1,
    avoidTimer: 0,
    stuckX: 0, stuckY: 0, stuckTimer: 0,
    wobble: rand(0, TAU),
    spawnAnim: 0.55,
    fireBurst: 0
  };
}
function findSpawnPos(r){
  for (let t = 0; t < 120; t++){
    const tx = randInt(2, MAP_W - 3), ty = randInt(2, MAP_H - 3);
    if (tileAt(tx, ty) !== 0) continue;
    const c = centerOf(tx, ty);
    if (dist2(c.x, c.y, player.x, player.y) < 430 * 430) continue;   // 别贴脸刷
    // 半径内无墙
    let ok = true;
    for (let k = 0; k < 8; k++){
      const a = k / 8 * TAU;
      if (isSolid(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r)) { ok = false; break; }
    }
    if (ok) return c;
  }
  // 兜底：地图角落
  return { x: TILE * 2, y: TILE * 2 };
}
function spawnEnemy(typeId, wave){
  const e = makeEnemy(typeId, wave);
  const p = findSpawnPos(e.r + 6);
  e.x = p.x; e.y = p.y;
  e.stuckX = p.x; e.stuckY = p.y;
  e.turretAng = Math.atan2(player.y - e.y, player.x - e.x);
  e.bodyAng = e.turretAng;
  enemies.push(e);
  rings.push({ x: e.x, y: e.y, r: e.r * 2.4, max: e.r * 0.6, life: 0.42, max_life: 0.42, color: '#ff9db0', w: 2.4, inwards: true });
  if (e.def.boss) boss = e;
  return e;
}

/* ============================================================
   波次
   ============================================================ */
function wavePlan(w){
  const list = [];
  const n = Math.min(4 + Math.floor(w * 1.7), 22);
  for (let i = 0; i < n; i++){
    let t = 'grunt';
    const r = Math.random();
    if (w >= 2 && r < 0.22) t = 'scout';
    if (w >= 3 && r >= 0.22 && r < 0.40) t = 'armored';
    if (w >= 4 && r >= 0.40 && r < 0.55) t = 'sniper';
    list.push(t);
  }
  return list;
}
function startWave(w){
  state.wave = w;
  state.plan = wavePlan(w);
  state.pendingSpawn = state.plan.length;
  state.spawnTimer = 0;
  state.waveActive = true;
  boss = null;
  waveMsg('WAVE ' + w, 1.6);
  SFX.wave();
  if (w % 5 === 0){
    state.plan.push('boss');
    state.pendingSpawn = state.plan.length;
  }
}
function waveMsg(txt, dur){
  const el = document.getElementById('waveMsg');
  if (!el) return;
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(waveMsg._t);
  waveMsg._t = setTimeout(function(){ el.classList.remove('show'); }, (dur || 1.5) * 1000);
}

/* ============================================================
   射击
   ============================================================ */
function muzzlePos(){
  const len = 34 - player.recoil * 8;
  return {
    x: player.x + Math.cos(player.turretAng) * len,
    y: player.y + Math.sin(player.turretAng) * len,
    ang: player.turretAng
  };
}
function tryFire(){
  if (state.mode !== 'play' || player.dead || player.cd > 0) return false;
  const ammo = curAmmo();
  const attr = curAttr();
  const m = muzzlePos();
  const ang = m.ang + rand(-ammo.spread, ammo.spread);

  // 射速：元素自带 rateMul（地球 ×1.75 更快 / 巨石 ×0.35 更慢）。
  // rateMul 是「频率」倍率，所以冷却要除以它而不是乘。
  const cdBase = ammo.cd * lvlCdMul() / (attr.rateMul || 1) / wsAspdMul() * (player.buffAtk > 0 ? 0.5 : 1);
  // 司南：红蓝磁极逐发交替（+1 = N 红，-1 = S 蓝）
  let pole = 0;
  if (attr.id === 'magnet'){
    player.magFlip = player.magFlip ? 0 : 1;
    pole = player.magFlip ? 1 : -1;
  }
  // 数学：字形 e,π,i,φ,γ,G,δ,√2,ζ(3) 逐发轮流
  let digit = -1;
  if (attr.id === 'math'){
    player.mathDigit = ((player.mathDigit | 0) + 1) % MATH_GLYPHS.length;
    digit = player.mathDigit;
  }

  // 立场圈：以自身为中心连续释放冲击波（无弹丸）
  if (ammo.id === 'stance'){
    player.cd = cdBase;
    player.recoil = 1;
    fireShock(player.x, player.y, ammo, attr);
    rings.push({ x: player.x, y: player.y, r: player.r * 0.6, max: ammo.range, life: 0.4, max_life: 0.4, color: attr.color, w: 2 });
    SFX.shoot(ammo.id);
    state.shake = Math.max(state.shake, 2);
    return true;
  }

  player.cd = cdBase;
  player.recoil = 1;

  if (ammo.hitscan){
    const gIdx = attr.id === 'math' ? digit : null;
    fireBeam(m.x, m.y, ang, ammo, attr, pole, gIdx);
    // 数学 + 激光：自身上方冒出一串白色发光字形
    if (attr.id === 'math'){
      for (let i = 0; i < 5; i++){
        const gi = (player.mathDigit + i) % MATH_GLYPHS.length;
        pushParticle({
          x: player.x + rand(-16, 16), y: player.y - player.r - rand(4, 20),
          vx: rand(-14, 14), vy: -rand(45, 110),
          life: rand(0.5, 1.0), max: 1.0, size: rand(7, 14),
          color: '#ffffff', type: 'glyph', ch: MATH_GLYPHS[gi], drag: 1.5, grav: -30
        });
      }
    }
  } else {
    bullets.push({
      id: uid++,
      x: m.x, y: m.y,
      px: m.x, py: m.y,
      vx: Math.cos(ang) * ammo.speed,
      vy: Math.sin(ang) * ammo.speed,
      ang: ang,
      // 巨石：弹径 +100%（更容易命中，也是它 0.35 攻速之外的手感补偿）
      // 数学：弹丸放大便于玩家看清字形
      r: ammo.r * (attr.sizeMul || 1) * (attr.id === 'math' ? 1.7 : 1),
      dmg: ammo.dmg,
      ammo: ammo.id,
      attr: attr.id,
      attrIdx: player.attrIdx,
      pierce: ammo.pierce || 0,
      // 篮球：剩余反弹次数（撞墙或撞坦克都消耗一次）
      bounce: attr.bounce || 0,
      pole: pole,
      digit: digit,
      glyphIdx: attr.id === 'math' ? digit : -1,
      glyph: attr.id === 'math' ? MATH_GLYPHS[digit] : '',
      hitSet: null,
      life: ammo.life || 1.5,
      // 巨石和篮球都是大弹丸，拖尾加长一点更有分量；地球拖尾再拉长
      trail: (ammo.trail || 12) * (attr.sizeMul ? 1.35 : 1) * (attr.id === 'earth' ? 1.8 : 1),
      dead: false
    });
  }

  // 炮口焰
  for (let i = 0; i < 7; i++){
    const a = ang + rand(-0.42, 0.42);
    const s = rand(90, 260);
    pushParticle({
      x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.1, 0.26), max: 0.26, size: rand(2, 4.5),
      color: i % 2 ? attr.glow : attr.color, type: 'spark', drag: 5
    });
  }
  rings.push({ x: m.x, y: m.y, r: 2, max: 20, life: 0.16, max_life: 0.16, color: attr.glow, w: 2 });

  SFX.shoot(ammo.id);
  state.shake = Math.max(state.shake, ammo.id === 'he' ? 4 : ammo.id === 'ap' ? 3.4 : 1.6);
  return true;
}

/** 激光：瞬发射线，沿途全部命中，遇墙终止（篮球元素可反弹） */
function fireBeam(x, y, ang, ammo, attr, pole, glyphIdx, bouncesLeft){
  const maxLen = ammo.beamLen || 1500;
  const step = 7;
  let endX = x, endY = y;
  const hitOnce = Object.create(null);
  let hitCount = 0;
  if (bouncesLeft == null) bouncesLeft = attr.bounce || 0;

  for (let d = 0; d < maxLen; d += step){
    const px = x + Math.cos(ang) * d;
    const py = y + Math.sin(ang) * d;
    if (isSolid(px, py)){
      endX = px; endY = py;
      damageWall((px / TILE) | 0, (py / TILE) | 0, 1);
      attrBurst(px, py, attr, 0.5, 'hit');
      // 篮球激光：撞墙后反弹（计算墙面法向 → 反射角 → 递归发射剩余反弹次数）
      if (bouncesLeft > 0){
        let nx = 0, ny = 0;
        const testX = x + Math.cos(ang) * (d - step), testY = y + Math.sin(ang) * (d - step);
        // 法向指向来射方向的开阔侧（testX/testY 为墙前一步、必为非实心）
        if (!isSolid(testX, py)) { nx = (testX < px) ? -1 : 1; }
        else { ny = (testY < py) ? -1 : 1; }
        const vx = Math.cos(ang), vy = Math.sin(ang);
        const dot = vx * nx + vy * ny;
        const rAng = Math.atan2(vy - 2 * dot * ny, vx - 2 * dot * nx);
        // 从撞击点沿法向偏移 10px，避免立即再次触发同一面墙
        const ox = px + nx * 10, oy = py + ny * 10;
        // 反弹视觉反馈（火花 + 小环）
        attrBurst(px, py, attr, 0.6, 'hit');
        rings.push({ x: px, y: py, r: 3, max: 16, life: 0.18, max_life: 0.18, color: attr.glow, w: 2 });
        // 递归发射反射后的激光
        fireBeam(ox, oy, rAng, ammo, attr, pole, glyphIdx, bouncesLeft - 1);
      }
      break;
    }
    endX = px; endY = py;
    // 锁定本帧敌人数量：分裂产生的新目标不应被同一条光线再次命中
    for (let i = 0, n0 = enemies.length; i < n0; i++){
      const e = enemies[i];
      if (e.dead || hitOnce[e.id]) continue;
      if (e.spawnAnim > 0) continue;
      if (dist2(px, py, e.x, e.y) < (e.r + 2) * (e.r + 2)){
        hitOnce[e.id] = 1;
        hitCount++;
        const r = computeDamage(ammo.dmg, attr.id, e, glyphIdx);
        hurtEnemy(e, r.dmg, attr.id, px, py, r.crit, r.tag, false);
        applyAttrEffect(attr.id, e, px, py, r.dmg, ang, pole ? { pole: pole } : null);
      }
    }
  }
  beams.push({
    x1: x, y1: y, x2: endX, y2: endY,
    life: 0.13, max: 0.13,
    attrIdx: player.attrIdx,
    w: ammo.beamW || 3.2
  });
  if (hitCount > 0) SFX.hit();
}

/** 爆炸（高爆弹 / 击杀爆炸） */
function explode(x, y, radius, dmg, attrId, skipWall){
  const attr = ATTRS[ATTR_INDEX[attrId]] || ATTRS[0];
  attrBurst(x, y, attr, 1.5, 'boom');
  rings.push({ x: x, y: y, r: 8, max: radius, life: 0.36, max_life: 0.36, color: attr.glow, w: 4 });
  state.shake = Math.max(state.shake, 9);
  SFX.boom();

  enemies.forEach(function(e){
    if (e.dead) return;
    const d = dist(e.x, e.y, x, y);
    if (d < radius + e.r){
      const falloff = clamp(1 - (d / (radius + e.r)) * 0.55, 0.45, 1);
      const r = computeDamage(dmg * falloff, attrId, e);
      hurtEnemy(e, r.dmg, attrId, e.x, e.y, r.crit, r.tag, false);
      applyAttrEffect(attrId, e, e.x, e.y, r.dmg, Math.atan2(e.y - y, e.x - x));
    }
  });
  if (!skipWall){
    const r0 = Math.ceil(radius / TILE);
    const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
    for (let yy = ty - r0; yy <= ty + r0; yy++){
      for (let xx = tx - r0; xx <= tx + r0; xx++){
        const c = centerOf(xx, yy);
        if (dist(c.x, c.y, x, y) <= radius) damageWall(xx, yy, 3);
      }
    }
  }
}

/** 生成火场（燃烧弹） */
function spawnZone(x, y, r, dps, dur, attrId){
